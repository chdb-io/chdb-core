<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>chDB nightly builds</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="app.js"></script>
</head>
<body>
  <div class="viz-root">
    <header class="page-header">
      <div>
        <h1>chDB nightly builds</h1>
        <p class="subtitle">chdb-core <code>main</code>, built after each ClickHouse master sync it merges. <span id="updated"></span></p>
      </div>
      <button id="theme" class="theme-toggle" type="button" aria-label="Switch color theme">Theme: system</button>
    </header>

    <div class="filters" role="group" aria-label="Date range">
      <span class="filter-label">Range</span>
      <button type="button" data-days="7">Last 7 days</button>
      <button type="button" data-days="30" aria-pressed="true">Last 30 days</button>
      <button type="button" data-days="90">Last 90 days</button>
    </div>

    <section class="tiles" id="tiles" aria-label="Summary"></section>

    <section class="card">
      <h2>Nightly status</h2>
      <div id="status"></div>
    </section>

    <section class="charts">
      <div class="card">
        <h2>Build and test time</h2>
        <p class="caption">Minutes per platform workflow</p>
        <div class="chart" id="duration-chart"></div>
      </div>
      <div class="card">
        <h2>Wheel size</h2>
        <p class="caption">MB per platform</p>
        <div class="chart" id="size-chart"></div>
      </div>
    </section>

    <section class="card">
      <h2>Failing tests in the newest night</h2>
      <div id="failing"></div>
    </section>

    <section class="card">
      <h2>Install a nightly</h2>
      <div id="install"></div>
    </section>

    <footer class="footer" id="footer"></footer>
  </div>
</body>
</html>
