# DEBUG-SVE256: temporary workflow to reproduce and debug the pyarrow 25.0.0
# SVE-256 dictionary-index corruption (apache/arrow#50503) directly on the
# self-hosted Graviton3 runner. Regular CI triggers are disabled on this
# branch while iterating; both will be reverted before merge.
name: SVE256 pyarrow repro (DEBUG)

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

jobs:
  repro:
    name: Graviton3 SVE-256 repro
    runs-on: [self-hosted, linux, arm64, ubuntu-latest]
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v3
      - name: CPU info
        run: |
          grep -m1 -E "CPU part" /proc/cpuinfo
          grep -m1 Features /proc/cpuinfo
          uname -r
      - name: Repro matrix (pyarrow 25 vs 24)
        run: |
          rm -rf /tmp/sve_dbg_venv
          python3 -m venv /tmp/sve_dbg_venv || {
            sudo apt-get update && sudo apt-get install -y python3-venv
            python3 -m venv /tmp/sve_dbg_venv
          }
          . /tmp/sve_dbg_venv/bin/activate
          python -V

          echo "================ pyarrow 25.0.0 ================"
          pip -q install "pyarrow==25.0.0" numpy
          if python .github/sve_repro/pattern.py; then
            echo "RESULT: pyarrow 25.0.0 CLEAN (repro NOT triggered on this host)"
          else
            echo "RESULT: pyarrow 25.0.0 CORRUPTION REPRODUCED"
          fi

          echo "================ pyarrow 24.0.0 control ================"
          pip -q install "pyarrow==24.0.0"
          python .github/sve_repro/pattern.py
          echo "RESULT: pyarrow 24.0.0 clean (expected)"
