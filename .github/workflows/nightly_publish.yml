name: Publish nightly build

# The nightly is main's build of a merged ClickHouse sync pull request: the four
# wheel workflows build that push like any other, and also upload their wheel to the
# rolling `nightly` pre-release. This runs when each of them finishes; for a sync's
# merge, once all four runs for the commit are done, it moves the release to that
# commit, keeps the newest 20 nights of wheels, builds the chdb nightly against it,
# and has chDB turn the night's results and logs into the nightly store in S3, which
# the nightly API (a chDB Lambda function) serves to the dashboard on Vercel.
# See .github/nightly/README.md.

on:
  workflow_run:
    workflows:
      - Build & Test Linux x86_64
      - Build & Test Linux arm64
      - Build & Test macOS arm64
      - Build & Test macOS x86_64
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      head_sha:
        description: 'Merged sync commit on main whose builds to publish (default: the newest build)'
        required: false
        default: ''

# Four completions per push, each publication idempotent. A commit's runs queue
# behind each other and the last one publishes; keyed by commit, so a completion for
# another commit cannot replace the night's pending run.
concurrency:
  group: nightly-publish-${{ github.event.workflow_run.head_sha || inputs.head_sha || github.run_id }}
  cancel-in-progress: false

permissions:
  contents: write       # the nightly release and its tag
  actions: read         # the build runs, their jobs and artifacts
  pull-requests: read   # the open sync pull request the dashboard shows
  id-token: write       # the AWS role that writes the nightly store, through GitHub's OIDC provider

jobs:
  publish:
    if: >-
      vars.NIGHTLY_PUBLISH_ENABLED == 'true' &&
      (github.event_name == 'workflow_dispatch' || github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Finish the nightly release
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_SITE_URL: ${{ vars.NIGHTLY_SITE_URL }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha || inputs.head_sha }}
        run: >-
          python3 .github/nightly/publish.py
          --head-sha "$HEAD_SHA"
          --work "$RUNNER_TEMP/nightly" --site "$RUNNER_TEMP/site"

      # chdb-io/chdb's main, which chdb_nightly.py copies and pins to the night's chdb-core.
      - uses: actions/checkout@v7
        if: steps.publish.outputs.ready == 'true'
        with:
          repository: chdb-io/chdb
          ref: main
          path: chdb-src
          persist-credentials: false

      # Never fails the night: the outcome goes into night.json for the dashboard.
      - name: Build the chdb nightly
        if: steps.publish.outputs.ready == 'true'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/nightly/chdb_nightly.py --work "$RUNNER_TEMP/nightly" --src chdb-src

      - name: Write the pip index and the release notes
        if: steps.publish.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_SITE_URL: ${{ vars.NIGHTLY_SITE_URL }}
        run: >-
          python3 .github/nightly/publish.py --index
          --work "$RUNNER_TEMP/nightly" --site "$RUNNER_TEMP/site"

      - name: Configure AWS credentials
        if: steps.publish.outputs.ready == 'true' && vars.NIGHTLY_BUCKET != ''
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.NIGHTLY_AWS_ROLE_ARN }}
          aws-region: ${{ vars.NIGHTLY_AWS_REGION }}

      # The latest release from PyPI: the nightly wheels stay on the release.
      - name: Install chDB
        if: steps.publish.outputs.ready == 'true'
        run: python3 -m pip install --quiet chdb-core

      # chDB reads the earlier nights from the bucket with the credentials above.
      - name: Build the dashboard data
        if: steps.publish.outputs.ready == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          NIGHTLY_SITE_URL: ${{ vars.NIGHTLY_SITE_URL }}
          NIGHTLY_API_URL: ${{ vars.NIGHTLY_API_URL }}
          NIGHTLY_S3_URL: >-
            ${{ vars.NIGHTLY_BUCKET && format('https://{0}.s3.{1}.amazonaws.com', vars.NIGHTLY_BUCKET, vars.NIGHTLY_AWS_REGION) || '' }}
        run: python3 .github/nightly/report.py --work "$RUNNER_TEMP/nightly" --site "$RUNNER_TEMP/site"

      # The night's Parquet files and logs, read by the nightly API and by later nights.
      - name: Store the night in S3
        if: steps.publish.outputs.ready == 'true' && vars.NIGHTLY_BUCKET != ''
        env:
          BUCKET: ${{ vars.NIGHTLY_BUCKET }}
        run: aws s3 cp "$RUNNER_TEMP/nightly/store" "s3://$BUCKET/" --recursive --no-progress

      - name: Install the Vercel CLI
        if: steps.publish.outputs.ready == 'true' && vars.VERCEL_PROJECT_ID != ''
        run: npm install --global vercel@64

      - name: Deploy the dashboard to Vercel
        if: steps.publish.outputs.ready == 'true' && vars.VERCEL_PROJECT_ID != ''
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ vars.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ vars.VERCEL_PROJECT_ID }}
        run: |
          : "${VERCEL_TOKEN:?the VERCEL_TOKEN secret is not set}"
          vercel deploy "$RUNNER_TEMP/site" --prod --yes --token "$VERCEL_TOKEN" --non-interactive

      - uses: actions/upload-artifact@v7
        if: steps.publish.outputs.ready == 'true'
        with:
          name: nightly-site-${{ github.run_id }}
          path: ${{ runner.temp }}/site
