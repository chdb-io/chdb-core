name: Build & Test Linux arm64

on:
  workflow_dispatch:
    inputs:
      TAG_NAME:
        description: 'Release Version Tag'
        required: true
      DEBUG_MODE:
        description: 'Enable debug mode (Debug build, lldb tests, skip static lib)'
        required: false
        default: 'true'
        type: boolean
  release:
    types: [published]
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths-ignore:
      - '**/*.md'


concurrency:
  # Superseded PR pushes stack multi-hour builds onto a small self-hosted pool,
  # starving later runs. Never cancel main or release runs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # DEBUG_MODE disabled for all builds
  EFFECTIVE_DEBUG_MODE: 'false'

jobs:
  build_universal_wheel:
    name: Build & Test Universal Wheel (Linux arm64)
    runs-on: [self-hosted, linux, arm64, ubuntu-latest]
    if: ${{ !github.event.pull_request.draft }}
    steps:
      - name: Check CPU capabilities and requirements
        run: |
          echo "=== CPU Information ==="
          cat /proc/cpuinfo
          echo ""
          echo "=== Checking CPU requirements ==="

          if grep -P "^(?=.*atomic)(?=.*ssbs)" /proc/cpuinfo > /dev/null; then
            echo "CPU meets minimum requirements (atomic and ssbs flags found)"
          else
            echo "CPU does not meet minimum requirements"
            echo "Missing required flags: atomic and/or ssbs"
            echo "This may cause build failures. Consider using -DNO_ARMV81_OR_HIGHER=1"
          fi
      - name: Install Python build dependencies
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y make build-essential libssl-dev zlib1g-dev \
            libbz2-dev libreadline-dev wget curl llvm \
            libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev \
            libffi-dev liblzma-dev libsqlite3-dev golang-go liblz4-dev
      - name: Install GitHub CLI
        run: |
          wget https://github.com/cli/cli/releases/download/v2.82.1/gh_2.82.1_linux_arm64.tar.gz -O gh.tar.gz
          tar -xf gh.tar.gz
          sudo cp gh_*/bin/gh /usr/local/bin/
          sudo chmod +x /usr/local/bin/gh
          if ! gh --version; then
            echo "ERROR: GitHub CLI installation failed!"
            exit 1
          fi
          echo "GitHub CLI installed successfully"
      - name: Scan SQLite vulnerabilities with grype
        run: |
          # Install grype and required tools
          mkdir -p $HOME/.local/bin
          curl -sSfL https://raw.githubusercontent.com/anchore/grype/main/install.sh | sh -s -- -b $HOME/.local/bin
          echo "$HOME/.local/bin" >> $GITHUB_PATH
          sudo apt-get -o DPkg::Lock::Timeout=600 update && sudo apt-get -o DPkg::Lock::Timeout=600 install -y jq lsb-release

          # Detect OS distribution info
          DISTRO_ID=$(lsb_release -si | tr '[:upper:]' '[:lower:]')
          DISTRO_VERSION=$(lsb_release -sr)
          echo "Detected OS: $DISTRO_ID:$DISTRO_VERSION"

          # Update grype vulnerability database
          $HOME/.local/bin/grype db update

          # Check SQLite vulnerabilities in installed packages
          echo "Scanning SQLite packages for vulnerabilities..."
          GRYPE_RAW_OUTPUT=$($HOME/.local/bin/grype dir:/var/lib/dpkg --distro "$DISTRO_ID:$DISTRO_VERSION" --scope all-layers 2>/dev/null || true)
          echo "Raw grype output:"
          echo "$GRYPE_RAW_OUTPUT"

          SQLITE_SCAN_OUTPUT=$(echo "$GRYPE_RAW_OUTPUT" | grep -i sqlite || true)

          if [ -n "$SQLITE_SCAN_OUTPUT" ]; then
            echo "❌ SQLite vulnerabilities found in packages! Build should be reviewed."
            echo "SQLite vulnerability details:"
            echo "$SQLITE_SCAN_OUTPUT"
            exit 1
          else
            echo "✅ No SQLite vulnerabilities found"
          fi
        continue-on-error: true
      - name: Setup pyenv
        run: |
          # Remove existing pyenv installation if present
          rm -rf $HOME/.pyenv
          curl https://pyenv.run | bash
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          # Python 3.8 removed
          pyenv install 3.9:latest
          pyenv install 3.10:latest
          pyenv install 3.11:latest
          pyenv install 3.12:latest
          pyenv install 3.13:latest
          pyenv install 3.14:latest
          pyenv global 3.9 3.10 3.11 3.12 3.13 3.14

          # Verify installations
          echo "Installed versions:"
          pyenv versions
      - name: Verify pyenv installations
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          echo "Installed Python versions:"
          pyenv versions
          echo ""
          echo "Verifying all required Python versions are available:"
          for version in 3.9 3.10 3.11 3.12 3.13 3.14; do
            if ! pyenv versions --bare | grep -q "^$version"; then
              echo "ERROR: Python $version is not installed!"
              exit 1
            fi
            echo "✓ Python $version is installed"
          done
          echo "All Python versions verified successfully!"
      - name: Install dependencies for all Python versions
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          for version in 3.9 3.10 3.11 3.12 3.13 3.14; do
            echo "Installing dependencies for Python $version"
            pyenv shell $version
            python -m pip install --upgrade pip
            # pyarrow<25: see the pin comment in "Test wheel on all Python versions"
            python -m pip install setuptools tox pandas "pyarrow<25" twine psutil deltalake wheel jupyter nbconvert "fastjsonschema<2.22"
            pyenv shell --unset
          done
      - name: Upgrade Rust toolchain
        run: |
          rustup toolchain install nightly-2026-03-22
          rustup default nightly-2026-03-22
          rustup component add rust-src
          rustc --version
          cargo --version
      - name: Install clang++ for Ubuntu
        run: |
          pwd
          uname -a
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          which clang++-21
          clang++-21 --version
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y make cmake ccache ninja-build yasm gawk wget
          # Install WebAssembly linker (wasm-ld)
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y lld-21
          # Create symlink for wasm-ld
          if ! command -v wasm-ld &> /dev/null; then
            sudo ln -sf /usr/bin/wasm-ld-21 /usr/bin/wasm-ld || true
          fi
          which wasm-ld || echo "wasm-ld not found in PATH"
          ccache -s
      - name: Update git
        run: |
          sudo add-apt-repository ppa:git-core/ppa -y
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y git
          git --version
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Update submodules
        run: |
          git submodule update --init --recursive --jobs 4
      - name: Update version for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.9

          # Install bump-my-version
          python -m pip install bump-my-version
          TAG_NAME=${GITHUB_REF#refs/tags/v}
          bump-my-version replace --new-version $TAG_NAME
          echo "Version files updated to $TAG_NAME"
          pyenv shell --unset
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ubuntu-24.04-aarch64
          max-size: 5G
          append-timestamp: true
      - name: remove old clang and link clang-21 to clang
        run: |
          sudo rm -f /usr/bin/clang || true
          sudo ln -s /usr/bin/clang-21 /usr/bin/clang
          sudo rm -f /usr/bin/clang++ || true
          sudo ln -s /usr/bin/clang++-21 /usr/bin/clang++
          which clang++
          clang++ --version
      - name: Install patchelf
        run: |
          wget https://github.com/NixOS/patchelf/releases/download/0.18.0/patchelf-0.18.0-aarch64.tar.gz -O patchelf.tar.gz
          tar -xvf patchelf.tar.gz
          sudo cp bin/patchelf /usr/bin/
          sudo chmod +x /usr/bin/patchelf
          patchelf --version
      # The engine reports the release it was built as, and that has to come from
      # the tag being built. chdb/vars.sh already writes it into both places that
      # matter — chdb.h's CHDB_VERSION, which chdb_version() returns and a C caller
      # reads out of the shipped header, and -DCHDB_VERSION, which is the only thing
      # that compiles chdbVersion() in at all (without it src/Functions/chdbVersion.cpp
      # is #if'd out of the build entirely). What it could not do is know which tag
      # this is: it asked git for the newest tag in the repository, which is a
      # different question, so cutting a release that is not the newest tag baked in
      # the wrong number. Telling it here is the whole fix; vars.sh keeps an
      # inherited value and falls back to asking git only for builds with no tag.
      - name: Name the release this build reports as
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          V=${GITHUB_REF#refs/tags/v}
          echo "CHDB_VERSION=$V" >> "$GITHUB_ENV"

      - name: Run chdb/build.sh
        timeout-minutes: 600
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          source ~/.cargo/env
          pyenv shell 3.9
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          # Use Debug for crash analysis when DEBUG_MODE is enabled
          if [ "${{ env.EFFECTIVE_DEBUG_MODE }}" == "true" ]; then
            bash ./chdb/build.sh Debug
          else
            bash ./chdb/build.sh
          fi
          pyenv shell 3.9
          bash -x ./chdb/test_smoke.sh
        continue-on-error: false
      - name: Run chdb/build/build_static_lib.sh
        if: env.EFFECTIVE_DEBUG_MODE != 'true'
        timeout-minutes: 600
        run: |
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          export PATH="$HOME/.pyenv/bin:$PATH"
          source ~/.cargo/env
          eval "$(pyenv init -)"
          pyenv shell 3.9
          bash ./chdb/build/build_static_lib.sh
          pyenv shell --unset
        continue-on-error: false
      - name: Scan chdb libraries with grype
        run: |
          echo "Scanning chdb libraries for vulnerabilities..."

          # Files to scan
          FILES_TO_SCAN=""
          [ -f libchdb.so ] && FILES_TO_SCAN="$FILES_TO_SCAN libchdb.so"
          [ -f libchdb.a ] && FILES_TO_SCAN="$FILES_TO_SCAN libchdb.a"
          FILES_TO_SCAN="$FILES_TO_SCAN $(find chdb/ \( -name "*.so" -o -name "*.dylib" \) 2>/dev/null || true)"

          SQLITE_VULNERABILITIES_FOUND=false

          for file in $FILES_TO_SCAN; do
            if [ -f "$file" ]; then
              echo "=== Scanning $file ==="
              SCAN_OUTPUT=$($HOME/.local/bin/grype "$file" 2>/dev/null || true)
              echo "$SCAN_OUTPUT"

              if echo "$SCAN_OUTPUT" | grep -qi sqlite; then
                echo "❌ SQLite vulnerability found in $file"
                SQLITE_VULNERABILITIES_FOUND=true
              fi
            fi
          done

          if [ "$SQLITE_VULNERABILITIES_FOUND" = true ]; then
            echo "❌ SQLite vulnerabilities detected in chdb libraries!"
            exit 1
          else
            echo "✅ No SQLite vulnerabilities found in chdb libraries"
          fi
        continue-on-error: false
      - name: Run libchdb stub in examples dir
        run: |
          bash -x ./examples/runStub.sh
          bash -x ./examples/runArrowTest.sh
          bash -x ./examples/runArrowStreamParse.sh
          bash -x ./examples/runArrowQueryTest.sh
          bash -x ./examples/runInsertProgressTest.sh
          bash -x ./examples/runStreamInsertTest.sh
          bash -x ./examples/runVersionHeaderTest.sh
          bash -x ./examples/runVersionTest.sh
          bash -x ./examples/runConnSettingsTest.sh
          bash -x ./examples/runStackTraceTest.sh
          bash -x ./examples/runStreamErrorTest.sh
          bash -x ./examples/runQueryParamsTest.sh
          bash -x ./examples/runStreamQueryEofTest.sh
          bash -x ./examples/runShutdownTest.sh
      # Both ADBC validation suites, against the libchdb just built. Placed
      # here rather than after the wheel tests so an unrelated failure there
      # does not withhold the result.
      - name: ADBC validation suites
        run: |
          set -eo pipefail
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"

          BUILD_DIR="$RUNNER_TEMP/adbc-validation"
          VENV="$RUNNER_TEMP/adbc-validation-venv"
          rm -rf "$BUILD_DIR" "$VENV"

          cmake -S programs/local/adbc/validation -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$BUILD_DIR" --parallel "$(getconf _NPROCESSORS_ONLN)"
          CHDB_ADBC_DRIVER="$GITHUB_WORKSPACE/libchdb.so" \
            programs/local/adbc/validation/run.sh "$BUILD_DIR"

          pyenv shell 3.13
          python -m venv "$VENV"
          "$VENV/bin/pip" install --disable-pip-version-check \
            -r programs/local/adbc/validation/python/requirements.txt
          cd programs/local/adbc/validation/python
          TZ=UTC CHDB_ADBC_DRIVER="$GITHUB_WORKSPACE/libchdb.so" \
            "$VENV/bin/python" -m pytest -q -rfEsxX \
              --junit-xml=validation-report.xml tests/
          # The capability matrix is rendered from the run, not maintained by hand.
          "$VENV/bin/python" -m tests.generate_documentation \
            --output "$RUNNER_TEMP/adbc-docs"
      - uses: actions/upload-artifact@v7
        with:
          name: adbc-capability-matrix
          path: ${{ runner.temp }}/adbc-docs/chdb.md
      - name: Check ccache statistics
        run: |
          ccache -s
          ls -lh chdb
          df -h
      - name: Build wheels
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          pyenv shell 3.9
          make wheel
      - name: Audit wheels
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.9
          python -m pip install auditwheel
          auditwheel -v repair -w dist/ --plat manylinux_2_17_aarch64 dist/*.whl
        continue-on-error: false
      - name: Show files
        run: |
          # e.g: remove chdb-0.11.4-cp310-cp310-linux_aarch64.whl, keep chdb-0.11.4-cp310-cp310-manylinux_2_17_aarch64.manylinux2014_aarch64.whl
          sudo rm -f dist/*linux_aarch64.whl
          ls -lh dist
        shell: bash
      - name: Setup core dump collection
        run: |
          # core_pattern must be absolute: the kernel resolves a relative
          # pattern against the crashing process's cwd, so cores from test
          # subprocesses (different cwd) were silently dropped.
          sudo mkdir -p /tmp/core && sudo chmod 1777 /tmp/core
          # Runners are persistent and /tmp/core is shared: drop stale cores
          # so the collection step only ever reports this run's crashes.
          sudo rm -f /tmp/core/core.*
          echo "/tmp/core/core.%p" | sudo tee /proc/sys/kernel/core_pattern
          ulimit -c unlimited
      - name: Start MinIO for S3 streaming-insert tests
        continue-on-error: true
        run: |
          # Provide a local S3-compatible endpoint so tests/test_streaming_insert_s3.py
          # runs in CI. Best-effort: the test self-skips if the endpoint is unreachable,
          # so a download/start hiccup never fails the build.
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)  OSARCH=linux-amd64 ;;
            Linux-aarch64) OSARCH=linux-arm64 ;;
            Darwin-arm64)  OSARCH=darwin-arm64 ;;
            Darwin-x86_64) OSARCH=darwin-amd64 ;;
            *) echo "unknown platform $(uname -s)-$(uname -m); skipping MinIO"; exit 0 ;;
          esac
          BIN="$HOME/.local/bin"; mkdir -p "$BIN"
          command -v minio >/dev/null 2>&1 || { curl -sSL "https://dl.min.io/server/minio/release/$OSARCH/minio" -o "$BIN/minio" && chmod +x "$BIN/minio"; }
          command -v mc    >/dev/null 2>&1 || { curl -sSL "https://dl.min.io/client/mc/release/$OSARCH/mc"       -o "$BIN/mc"    && chmod +x "$BIN/mc"; }
          export PATH="$BIN:$PATH"
          mkdir -p /tmp/minio_data
          MINIO_ROOT_USER=clickhouse MINIO_ROOT_PASSWORD=clickhouse \
            minio server --address ":11111" /tmp/minio_data > /tmp/minio.log 2>&1 &
          for i in $(seq 1 20); do
            if mc alias set ciminio http://localhost:11111 clickhouse clickhouse >/dev/null 2>&1; then
              mc mb --ignore-existing ciminio/test >/dev/null 2>&1 || true
              {
                echo "CHDB_S3_TEST=1"
                echo "CHDB_S3_ENDPOINT=http://localhost:11111/test"
                echo "CHDB_S3_ACCESS_KEY=clickhouse"
                echo "CHDB_S3_SECRET_KEY=clickhouse"
              } >> "$GITHUB_ENV"
              echo "MinIO ready on :11111; S3 streaming-insert tests enabled."
              break
            fi
            sleep 1
          done
      - name: Test wheel on all Python versions
        run: |
          ulimit -c unlimited
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"

          DEBUG_MODE="${{ env.EFFECTIVE_DEBUG_MODE }}"

          # Install lldb for debugging when DEBUG_MODE is enabled
          if [ "$DEBUG_MODE" == "true" ]; then
            sudo apt-get -o DPkg::Lock::Timeout=600 install -y lldb-21
            sudo ln -sf /usr/bin/lldb-21 /usr/bin/lldb || true
          fi

          for version in 3.9 3.10 3.11 3.12 3.13 3.14; do
            # pandas 3.x requires Python >=3.11
            if [[ "$version" == "3.9" || "$version" == "3.10" ]]; then
              PANDAS_CONSTRAINTS=("pandas<3.0")
            else
              PANDAS_CONSTRAINTS=("pandas<3.0" "pandas>=3.0")
            fi
            for PANDAS_CONSTRAINT in "${PANDAS_CONSTRAINTS[@]}"; do
              echo "=============================================="
              echo "Testing chdb on Python $version with $PANDAS_CONSTRAINT"
              echo "=============================================="
              pyenv shell $version
              # pyarrow 25.0.0 aarch64 aborts reading dictionary-encoded parquet
              # (parquet::ParquetStatusException: Index not in dictionary bounds)
              # when loaded alongside chdb; x86_64 is unaffected. Pin until fixed.
              python -m pip install dist/*.whl "$PANDAS_CONSTRAINT" "pyarrow<25" --force-reinstall
              # ADBC driver tests (tests/test_adbc_driver.py) load libchdb via the standard driver manager
              python -c "import adbc_driver_manager" 2>/dev/null || python -m pip install -q adbc-driver-manager==1.8.0
              echo "Installed pandas version:"
              python -c "import pandas; print(pandas.__version__)"
              python -c "import chdb; res = chdb.query('select 1112222222,555', 'CSV'); print(f'Python $version: {res}')"

              if [ "$DEBUG_MODE" == "true" ]; then
                python -m pip install pytest pytest-cov pytest-timeout
                REAL_PYTHON=$(pyenv which python)
                echo "=== Running tests with lldb on Python $version (path: $REAL_PYTHON) ==="
                LLDB_OUTPUT=$(mktemp)
                lldb -b \
                  -o "process handle SIGABRT -n true -p true -s true" \
                  -o "process handle SIGSEGV -n true -p true -s true" \
                  -o "process handle SIGBUS -n true -p true -s true" \
                  -o "process handle SIGFPE -n true -p true -s true" \
                  -o "process handle SIGILL -n true -p true -s true" \
                  -o "target stop-hook add --one-liner 'bt all'" \
                  -o "target stop-hook add --one-liner 'quit'" \
                  -o "run -m pytest tests/ -v --tb=short" \
                  -o "bt all" \
                  -o "quit" \
                  -- "$REAL_PYTHON" 2>&1 | tee "$LLDB_OUTPUT"
                if grep -qE "(stop reason = signal|received signal|hit Breakpoint.*__abort|Process.*exited.*signal)" "$LLDB_OUTPUT"; then
                  echo "ERROR: Crash signal detected!"
                  rm -f "$LLDB_OUTPUT"
                  exit 1
                fi
                EXIT_CODE=$(grep -oE "Process [0-9]+ exited with status = [0-9]+" "$LLDB_OUTPUT" | tail -1 | sed "s/.*= //" || echo "0")
                rm -f "$LLDB_OUTPUT"
                if [ "$EXIT_CODE" != "0" ]; then
                  echo "ERROR: Tests failed with exit code $EXIT_CODE"
                  exit $EXIT_CODE
                fi
              else
                make test
              fi

              echo "=============================================="
              echo "Tests PASSED on Python $version with $PANDAS_CONSTRAINT"
              echo "=============================================="
            done
            pyenv shell --unset
          done
        continue-on-error: false
      - name: Run benchmarks on Python 3.14 (pandas 2.x and 3.x)
        if: env.EFFECTIVE_DEBUG_MODE != 'true'
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.14
          for PANDAS_CONSTRAINT in "pandas<3.0" "pandas>=3.0"; do
            echo "=== Benchmarks with $PANDAS_CONSTRAINT ==="
            python -m pip install dist/*.whl "$PANDAS_CONSTRAINT" "pyarrow<25" --force-reinstall --no-cache-dir -q
            for bench in tests/benchmarks/bench_*.py; do
              echo "--- Running $bench ---"
              python "$bench"
            done
            python -m pip uninstall -y chdb-core
          done
          pyenv shell --unset
        continue-on-error: true
      - name: Test torch compatibility on Python 3.11
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.11
          python -m pip install dist/*.whl "pyarrow<25" --force-reinstall
          python -m pip install pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pytest tests/test_torch_compatibility.py -v
          pyenv shell --unset
        continue-on-error: false
      - name: Test chdb DataStore tests against upstream chdb (latest tag)
        if: env.EFFECTIVE_DEBUG_MODE != 'true'
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          ulimit -c unlimited
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.11
          # pyarrow<25: see the pin comment in "Test wheel on all Python versions"
          python -m pip install dist/*.whl "pyarrow<25" --force-reinstall
          PYTHON=$(pyenv which python) bash ./chdb/test_chdb_datastore.sh
          pyenv shell --unset
        continue-on-error: false
      - name: Run notebook tests
        if: env.EFFECTIVE_DEBUG_MODE != 'true'
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.9
          python -m pip install dist/*.whl "pyarrow<25" --force-reinstall
          jupyter nbconvert --to notebook --execute tests/test_data_insertion.ipynb --output test_data_insertion_output.ipynb
          pyenv shell --unset
        continue-on-error: false
      # Verify+package debug must run before the lite build (overwrites _chdb.abi3.so).
      - name: Verify debug symbols are usable
        run: |
          ADDR2LINE=$(command -v llvm-addr2line-19 || command -v llvm-addr2line || command -v addr2line)
          verify() {
            local so=$1 symbol=$2 debug=$3
            [ -f "$so" ] || { echo "FAIL: missing $so"; exit 1; }
            [ -f "$debug" ] || { echo "FAIL: missing $debug"; exit 1; }
            local so_id=$(readelf -n "$so"    | awk '/Build ID/{print $NF}')
            local dbg_id=$(readelf -n "$debug" | awk '/Build ID/{print $NF}')
            [ -n "$so_id" ] && [ -n "$dbg_id" ] || { echo "FAIL: missing Build-ID (so='$so_id' debug='$dbg_id')"; exit 1; }
            [ "$so_id" = "$dbg_id" ] || { echo "FAIL: Build-ID mismatch $so_id vs $dbg_id"; exit 1; }
            echo "$so Build-ID matches $debug: $so_id"
            local addr=$(nm -D --defined-only "$so" | awk -v s="$symbol" '$3 == s {print $1; exit}')
            [ -n "$addr" ] || { echo "FAIL: $symbol not exported in $so"; exit 1; }
            local out=$("$ADDR2LINE" -fe "$debug" "0x$addr")
            echo "$debug @ 0x$addr ($symbol) -> $out"
            local func=$(echo "$out" | sed -n '1p')
            local loc=$(echo "$out"  | sed -n '2p')
            case "$func" in '??'|'') echo "FAIL: function name unresolved at $addr"; exit 1 ;; esac
            case "$loc"  in '??:0'|'??:?'|'') echo "FAIL: source location unresolved at $addr"; exit 1 ;; esac
          }
          verify chdb/_chdb.abi3.so PyInit__chdb _chdb.abi3.so.debug
          verify chdb/_chdb.abi3.so chdb_adbc_init _chdb.abi3.so.debug
          verify chdb/_chdb.abi3.so AdbcDriverInit _chdb.abi3.so.debug
          verify libchdb.so query_stable libchdb.so.debug
          verify libchdb.so chdb_adbc_init libchdb.so.debug
          verify libchdb.so AdbcDriverInit libchdb.so.debug
      - name: Package debug symbols
        run: |
          ls *.debug
          tar -czvf linux-aarch64-debuginfo.tar.gz *.debug
          ls -lh linux-aarch64-debuginfo.tar.gz
      # -----------------------------------------------------------------------
      # chdb-core-lite: slim variant build & smoke test (~50 MB wheel)
      # chdb/build.sh's CHDB_LITE branch skips the libchdb.so link entirely —
      # only _chdb.abi3.so is produced (lite is Python-only).
      # -----------------------------------------------------------------------
      - name: Build chdb-core-lite (_chdb.abi3.so only, skips libchdb.so)
        if: env.EFFECTIVE_DEBUG_MODE != 'true' && !startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 600
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          source ~/.cargo/env
          pyenv shell 3.9
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          rm -rf buildlib
          CHDB_LITE=1 bash ./chdb/build.sh
        continue-on-error: false
      - name: Build chdb-core-lite wheel
        if: env.EFFECTIVE_DEBUG_MODE != 'true' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          export CC=/usr/bin/clang
          export CXX=/usr/bin/clang++
          pyenv shell 3.9
          CHDB_LITE=1 make wheel
        continue-on-error: false
      - name: Audit chdb-core-lite wheel
        if: env.EFFECTIVE_DEBUG_MODE != 'true' && !startsWith(github.ref, 'refs/tags/v')
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.9
          auditwheel -v repair -w dist/ --plat manylinux_2_17_aarch64 dist/chdb_core_lite-*linux_aarch64.whl
          sudo rm -f dist/chdb_core_lite-*-linux_aarch64.whl
          ls -lh dist
        continue-on-error: false
      # NOTE: v26.7 lite wheel is ~50.8 MiB; size gate disabled until the budget is re-tuned.
      # - name: Verify chdb-core-lite wheel size < 50 MiB
        # if: env.EFFECTIVE_DEBUG_MODE != 'true'
        # run: |
          # set -e
          # WHEEL=$(ls dist/chdb_core_lite-*manylinux*.whl | head -1)
          # SIZE=$(wc -c < "$WHEEL")
          # MAX=52428800
          # MIB=$(awk "BEGIN{printf \"%.2f\", $SIZE/1048576}")
          # if [ "$SIZE" -ge "$MAX" ]; then
            # echo "ERROR: $(basename $WHEEL) is $SIZE bytes (${MIB} MiB), must be < 50 MiB (52,428,800 bytes)"
            # exit 1
          # fi
          # echo "OK: $(basename $WHEEL) is $SIZE bytes (${MIB} MiB), under 50 MiB"
        # continue-on-error: false
      - name: Test chdb-core-lite wheel on Python 3.9 and 3.14
        if: ${{ !startsWith(github.ref, 'refs/tags/v') }}
        run: |
          ulimit -c unlimited
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          for version in 3.9 3.14; do
            echo "=============================================="
            echo "Testing chdb-core-lite on Python $version"
            echo "=============================================="
            pyenv shell $version
            # Clean any chdb-core left over from earlier steps before installing lite —
            # both packages ship the same chdb/ module path; pip metadata would otherwise
            # list both, and uninstalling lite later could leave a half-cleaned tree.
            python -m pip uninstall -y chdb-core || true
            python -m pip uninstall -y chdb-core-lite || true
            # pyarrow<25: see the pin comment in "Test wheel on all Python versions"
            python -m pip install dist/chdb_core_lite-*manylinux*.whl "pyarrow<25" --force-reinstall
            python -c "import chdb; res = chdb.query('select 1112222222,555', 'CSV'); print(f'Python $version: {res}')"
            # Full test suite + lite-only tests (CHDB_LITE=1 unlocks tests/test_chdb_core_lite.py)
            CHDB_LITE=1 make test
            python -m pip uninstall -y chdb-core-lite
            echo "=============================================="
            echo "Tests PASSED on Python $version"
            echo "=============================================="
          done
          pyenv shell --unset
        continue-on-error: false
      - name: Test chdb-core-lite DataStore tests against upstream chdb (latest tag)
        if: env.EFFECTIVE_DEBUG_MODE != 'true' && !startsWith(github.ref, 'refs/tags/v')
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          ulimit -c unlimited
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.11
          python -m pip uninstall -y chdb-core || true
          python -m pip uninstall -y chdb-core-lite || true
          # pyarrow<25: see the pin comment in "Test wheel on all Python versions"
          python -m pip install dist/chdb_core_lite-*manylinux*.whl "pyarrow<25" --force-reinstall
          CHDB_LITE=1 PYTHON=$(pyenv which python) bash ./chdb/test_chdb_datastore.sh
          python -m pip uninstall -y chdb-core-lite
          pyenv shell --unset
        continue-on-error: false
      - name: Restore pyproject.toml (chdb-core-lite build mutates it in place)
        if: always()
        run: |
          git checkout -- pyproject.toml
      - name: Check and upload core files if present
        if: always()
        run: |
          if ls /tmp/core/core.* >/dev/null 2>&1; then
            echo "CORE_FILES_FOUND=true" >> $GITHUB_ENV
            tar -czvf core-files-linux-aarch64.tar.gz /tmp/core/core.*
            echo "Core files tar created: core-files-linux-aarch64.tar.gz"
            ls -lh core-files-linux-aarch64.tar.gz
          else
            echo "CORE_FILES_FOUND=false" >> $GITHUB_ENV
            echo "No core files found in /tmp/core"
          fi
        continue-on-error: true
      - name: Keep killall ccache and wait for ccache to finish
        if: always()
        run: |
          sleep 60
          while ps -ef | grep ccache | grep -v grep; do \
            killall ccache; \
            sleep 10; \
          done
      - name:  Upload core files if present
        if: always() && env.CORE_FILES_FOUND == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: core-files-linux-aarch64
          path: core-files-linux-aarch64.tar.gz
      - name: Upload wheels to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload ${{ github.ref_name }} dist/chdb_core-*.whl --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      # NOTE: chdb-core-lite release-asset upload temporarily disabled (like its PyPI
      # upload below); the wheel is still built and kept as a CI artifact.
      # - name: Upload chdb-core-lite wheel to release
      #   if: startsWith(github.ref, 'refs/tags/v')
      #   run: |
      #     gh release upload ${{ github.ref_name }} dist/chdb_core_lite-*.whl --clobber
      #   env:
      #     GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Packege libchdb.so
        run: |
          cp programs/local/chdb.h chdb.h
          cp programs/local/chdb.hpp chdb.hpp
          chmod 0644 chdb.h chdb.hpp
          tar -czvf linux-aarch64-libchdb.tar.gz libchdb.so chdb.h chdb.hpp
      - name: Package libchdb.a
        if: env.EFFECTIVE_DEBUG_MODE != 'true'
        run: |
          cp programs/local/chdb.h chdb.h
          cp programs/local/chdb.hpp chdb.hpp
          chmod 0644 chdb.h chdb.hpp
          tar -czvf linux-aarch64-libchdb-static.tar.gz libchdb.a chdb.h chdb.hpp
      - name: Upload libchdb.so to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload ${{ github.ref_name }} linux-aarch64-libchdb.tar.gz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Upload libchdb.a to release
        if: startsWith(github.ref, 'refs/tags/v') && env.EFFECTIVE_DEBUG_MODE != 'true'
        run: |
          gh release upload ${{ github.ref_name }} linux-aarch64-libchdb-static.tar.gz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Upload debug symbols to release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          gh release upload ${{ github.ref_name }} linux-aarch64-debuginfo.tar.gz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: chdb-artifacts-linux-aarch64
          path: |
            ./dist/*.whl
            ./linux-aarch64-libchdb.tar.gz
            ./linux-aarch64-libchdb-static.tar.gz
            ./linux-aarch64-debuginfo.tar.gz
          overwrite: true
      - name: Upload pypi
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc')
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.9
          python -m twine upload dist/chdb_core-*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      # NOTE: chdb-core-lite PyPI publishing temporarily disabled; uncomment to re-enable.
      # - name: Upload chdb-core-lite to pypi
      #   if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc')
