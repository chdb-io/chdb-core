name: Pull-CI

on:
  pull_request:
    types: [opened, synchronize]

jobs:
  build:
    env:
      PYTHON_VERSIONS: "3.11"

    runs-on: gh-64c
    steps:
      - name: Clone chDB repository
        uses: actions/checkout@v2
        with:
          repository: "chdb-io/chdb-core"
          ref: "refs/pull/${{ github.event.pull_request.number }}/merge"
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Python
        uses: actions/setup-python@v2
        with:
          python-version: 3.11

      - name: Install flake8
        run: python -m pip install flake8

      - name: Run flake8
        run: |
          # Uses root setup.cfg for unified configuration
          flake8 chdb --count --show-source --statistics

  # Checks the ADBC driver against two external suites: the Apache Arrow ADBC
  # conformance suite (the C contract) and the ADBC Driver Foundry's validation
  # framework (SQL dialect, types, metadata, ingest).
  #
  # Both load the driver by path, so this validates the newest release on every
  # platform that ships one. A change to programs/local/chdb-adbc.cpp is covered
  # once it ships in a release.
  adbc-validation:
    name: adbc-validation (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-latest
          - platform: linux-aarch64
            runner: ubuntu-24.04-arm
          - platform: macos-arm64
            runner: macos-14
          - platform: macos-x86_64
            runner: macos-15-intel
    steps:
      - uses: actions/checkout@v4
        with:
          repository: "chdb-io/chdb-core"
          ref: "refs/pull/${{ github.event.pull_request.number }}/merge"

      - name: Download libchdb from the newest release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Resolve the tag explicitly to include prereleases; `gh release
          # download` without one picks the latest stable.
          tag="$(gh release list --repo chdb-io/chdb-core --limit 1 --exclude-drafts \
                   --json tagName --jq '.[0].tagName')"
          asset="${{ matrix.platform }}-libchdb.tar.gz"
          echo "Validating the driver from $tag ($asset)"
          gh release download "$tag" --repo chdb-io/chdb-core \
            --pattern "$asset" --dir /tmp/libchdb
          tar -xzf "/tmp/libchdb/$asset" -C /tmp/libchdb
          # Fail once here rather than in every test case. Only GNU nm has -D,
          # and Mach-O prefixes symbols with an underscore.
          if [ "$(uname)" = "Darwin" ]; then
            symbols="$(nm -gU /tmp/libchdb/libchdb.so)"
          else
            symbols="$(nm -D --defined-only /tmp/libchdb/libchdb.so)"
          fi
          printf '%s\n' "$symbols" | grep -Eq '\b_?chdb_adbc_init$' \
            || { echo "::error::$tag does not export chdb_adbc_init"; exit 1; }

      - name: Build the conformance suite
        run: |
          cmake -S programs/local/adbc/validation -B /tmp/adbc-validation \
            -DCMAKE_BUILD_TYPE=Release
          # macOS has no nproc.
          cmake --build /tmp/adbc-validation \
            --parallel "$(getconf _NPROCESSORS_ONLN)"

      - name: Run the conformance suite
        env:
          CHDB_ADBC_DRIVER: /tmp/libchdb/libchdb.so
        run: programs/local/adbc/validation/run.sh /tmp/adbc-validation

      # The framework requires Python >= 3.13; the wheel build pins 3.9.
      - name: Setup Python for the validation framework
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install the validation framework
        run: |
          python -m venv /tmp/validation-venv
          /tmp/validation-venv/bin/pip install --disable-pip-version-check \
            -r programs/local/adbc/validation/python/requirements.txt

      - name: Run the validation suite
        working-directory: programs/local/adbc/validation/python
        env:
          CHDB_ADBC_DRIVER: /tmp/libchdb/libchdb.so
          # The timestamptz cases compare against UTC epochs.
          TZ: UTC
        run: |
          /tmp/validation-venv/bin/python -m pytest \
            -vvs --junit-xml=validation-report.xml -rfEsxX tests/

      # The capability matrix is rendered from the run, not maintained by hand.
      - name: Generate the capability matrix
        working-directory: programs/local/adbc/validation/python
        run: |
          /tmp/validation-venv/bin/python -m tests.generate_documentation \
            --output /tmp/adbc-docs

      - uses: actions/upload-artifact@v4
        with:
          name: adbc-capability-matrix-${{ matrix.platform }}
          path: /tmp/adbc-docs/chdb.md
