name: One-off macOS 27 wheel smoke test

on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main

permissions:
  actions: read
  contents: read

env:
  SOURCE_RUN_ID: "36387533651"
  SOURCE_ARTIFACT: macos27-wheel-inputs

jobs:
  test_on_macos27:
    name: Build and test existing arm64 artifact on macOS 27
    # actionlint versions shipped before the public preview do not know this label.
    runs-on: ${{ 'xcode-27' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Download existing cross-compile artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$SOURCE_RUN_ID" \
            --repo "$GITHUB_REPOSITORY" \
            --name "$SOURCE_ARTIFACT" \
            --dir .

      - name: Show environment
        run: |
          sw_vers
          uname -a
          uname -m
          python3 --version

      - name: Build wheel in a virtual environment
        run: |
          python3 -m venv .build-venv
          .build-venv/bin/python -m pip install --upgrade pip build
          .build-venv/bin/python -m build --wheel

      - name: Install and smoke test
        run: |
          python3 -m venv .test-venv
          .test-venv/bin/python -m pip install --no-deps dist/chdb_core-*.whl
          .test-venv/bin/python - <<'PY'
          import platform
          import chdb

          print("architecture:", platform.machine())
          print("chdb:", chdb.__file__)
          result = chdb.query("SELECT 1", "CSV").bytes()
          print("query result:", result)
          assert result == b"1\n"
          PY
