# Build chdb for WebAssembly (Emscripten) and run the Node + headless-Chrome
# tests. The tag-time distribution steps (npm publish + GitHub Release asset)
# are currently DISABLED (`if: false` below) — chdb-wasm is not distributed on
# tags for now; the per-run CI artifact remains available. To re-enable, restore
# the original condition noted on each step.
#
# Runs on every push to main, pull request, manual dispatch, and v* tags. One
# Linux x86_64 (self-hosted) runner is enough: the .wasm is host-independent.
# Requires repo secrets: NPM_TOKEN (npm automation token that can publish
# chdb-wasm AND chdb-cloudflare — the first chdb-cloudflare release CREATES the
# package, so a granular token must allow creating new packages) and GH_TOKEN
# (to attach the published npm tarball to the GitHub release).
name: wasm

on:
  workflow_dispatch:
    inputs:
      publish:
        description: 'Publish to npm after build + all tests pass'
        type: boolean
        default: false
      version:
        description: 'chdb-wasm version to publish (e.g. 0.3.1); leave empty to skip publishing chdb-wasm'
        type: string
        default: ''
      cloudflare_version:
        description: 'chdb-cloudflare version to publish (e.g. 0.1.0); leave empty to skip publishing chdb-cloudflare'
        type: string
        default: ''
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**/*.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths-ignore:
      - '**/*.md'

concurrency:
  group: wasm-${{ github.ref }}
  # Cancel superseded build/test runs on branches & PRs, but never cancel a tag
  # run mid-publish.
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

env:
  EMSDK_VERSION: '5.0.7'      # match the known-good local toolchain (Emscripten 5.0.7)
  NODE_VERSION: '24'         # Memory64 (-sMEMORY64) needs V8 from Node >= 23

jobs:
  build-and-test:
    # Skip draft PRs — the 2h build/test cycle only runs once the PR is marked
    # ready (`ready_for_review` is in the trigger types, so that transition
    # starts a run). Pushes to main, tags and manual dispatch are unaffected.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    # Self-hosted Linux x86_64 runner (same pool as the native wheel builds). The
    # .wasm artifact is host-independent, so one platform is enough. No
    # free-disk-space step: that is for ephemeral GitHub-hosted images and would
    # delete tooling from a persistent self-hosted machine.
    runs-on: [self-hosted, linux, x64, ubuntu-latest]
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y --no-install-recommends lld ninja-build ccache

      # emcmake needs a recent cmake on PATH; the self-hosted runner does not provide
      # one for this job, so install a pinned cmake (+ninja) ourselves.
      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest

      # Caches the installed emsdk between runs (keyed by EMSDK_VERSION).
      - name: Setup Emscripten ${{ env.EMSDK_VERSION }} (cached)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache-${{ env.EMSDK_VERSION }}

      # Node >= 23 to RUN the wasm. Set up AFTER emsdk so this node wins on PATH
      # over the (older) node bundled with emsdk.
      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'  # needed for `npm publish` auth on tags

      - name: Configure + build chdb_wasm (threaded + single-threaded)
        run: |
          source "${EMSDK}/emsdk_env.sh"
          # Threaded bundle (WASM_THREADS=ON, needs cross-origin isolation) -> buildwasm/
          chdb/build-wasm.sh build
          # Single-threaded bundle (WASM_THREADS=OFF, runs on non-isolated pages) -> buildwasm-st/
          BUILD_DIR="${GITHUB_WORKSPACE}/buildwasm-st" WASM_THREADS=OFF chdb/build-wasm.sh build
          ls -la buildwasm/programs/wasm/chdb.wasm buildwasm-st/programs/wasm/chdb.wasm

      - name: Verify Node version (must be >= 23 for Memory64)
        run: |
          node --version
          node -e 'if (Number(process.versions.node.split(".")[0]) < 23) { throw new Error("need Node >= 23"); }'

      - name: Smoke test (bare C-API)
        working-directory: buildwasm/programs/wasm
        run: |
          cp "${GITHUB_WORKSPACE}/programs/wasm/chdb.test.mjs" .
          node chdb.test.mjs

      - name: Smoke test (async package, threaded bundle)
        env:
          CHDB_WASM_MJS: ${{ github.workspace }}/buildwasm/programs/wasm/chdb.mjs
        run: node packages/chdb-wasm/test/smoke.test.mjs

      - name: Smoke test (async package, single-threaded bundle)
        env:
          CHDB_WASM_MJS: ${{ github.workspace }}/buildwasm-st/programs/wasm/chdb.mjs
        run: node packages/chdb-wasm/test/smoke.test.mjs

      - name: Query matrix (threaded bundle)
        env:
          CHDB_WASM_MJS: ${{ github.workspace }}/buildwasm/programs/wasm/chdb.mjs
        run: node packages/chdb-wasm/test/matrix.test.mjs

      - name: Query matrix (single-threaded bundle)
        env:
          CHDB_WASM_MJS: ${{ github.workspace }}/buildwasm-st/programs/wasm/chdb.mjs
        run: node packages/chdb-wasm/test/matrix.test.mjs

      # Data-lake tests are self-contained: pyiceberg writes real Iceberg tables
      # into moto (a local in-process S3), and a ~60-line Node mock serves the
      # Iceberg REST catalog endpoints — no external services. They only need a
      # Python venv with the lakehouse packages (the tests skip without it).
      - name: Set up data-lake test venv (pyiceberg + moto)
        run: |
          # The self-hosted image lacks ensurepip (Debian splits it out).
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y --no-install-recommends python3-venv
          python3 -m venv "${GITHUB_WORKSPACE}/.iceberg-venv"
          "${GITHUB_WORKSPACE}/.iceberg-venv/bin/pip" install -q "pyiceberg[sql-sqlite]" pyarrow "moto[server]" s3fs deltalake

      # MinIO strictly verifies SigV4 signatures (moto does not), closing the
      # signing loop. Downloaded once into the workspace; tests skip without it.
      - name: Fetch MinIO
        run: |
          mkdir -p "${GITHUB_WORKSPACE}/.bin"
          if [ ! -x "${GITHUB_WORKSPACE}/.bin/minio" ]; then
            curl -fsSL -o "${GITHUB_WORKSPACE}/.bin/minio" https://dl.min.io/server/minio/release/linux-amd64/minio
            chmod +x "${GITHUB_WORKSPACE}/.bin/minio"
          fi

      - name: Iceberg local table via MEMFS (mt + st)
        env:
          ICEBERG_PY: ${{ github.workspace }}/.iceberg-venv/bin/python
        run: |
          CHDB_WASM_MJS="${GITHUB_WORKSPACE}/buildwasm/programs/wasm/chdb.mjs" node packages/chdb-wasm/test/iceberg-local.test.mjs
          CHDB_WASM_MJS="${GITHUB_WORKSPACE}/buildwasm-st/programs/wasm/chdb.mjs" node packages/chdb-wasm/test/iceberg-local.test.mjs

      - name: DataLakeCatalog + Iceberg-on-S3 (mt + st, moto)
        env:
          ICEBERG_PY: ${{ github.workspace }}/.iceberg-venv/bin/python
        run: |
          CHDB_WASM_MJS="${GITHUB_WORKSPACE}/buildwasm/programs/wasm/chdb.mjs" node packages/chdb-wasm/test/datalake.test.mjs
          CHDB_WASM_MJS="${GITHUB_WORKSPACE}/buildwasm-st/programs/wasm/chdb.mjs" node packages/chdb-wasm/test/datalake.test.mjs

      - name: DataLakeCatalog + Iceberg-on-S3 (mt + st, MinIO — verified SigV4)
        env:
          ICEBERG_PY: ${{ github.workspace }}/.iceberg-venv/bin/python
          MINIO_BIN: ${{ github.workspace }}/.bin/minio
          CHDB_S3_BACKEND: minio
        run: |
          CHDB_WASM_MJS="${GITHUB_WORKSPACE}/buildwasm/programs/wasm/chdb.mjs" node packages/chdb-wasm/test/datalake.test.mjs
          CHDB_WASM_MJS="${GITHUB_WORKSPACE}/buildwasm-st/programs/wasm/chdb.mjs" node packages/chdb-wasm/test/datalake.test.mjs

      - name: Unity catalog + Delta Lake (mt + st)
        env:
          ICEBERG_PY: ${{ github.workspace }}/.iceberg-venv/bin/python
        run: |
          CHDB_WASM_MJS="${GITHUB_WORKSPACE}/buildwasm/programs/wasm/chdb.mjs" node packages/chdb-wasm/test/datalake-unity.test.mjs
          CHDB_WASM_MJS="${GITHUB_WORKSPACE}/buildwasm-st/programs/wasm/chdb.mjs" node packages/chdb-wasm/test/datalake-unity.test.mjs

      # A REAL Iceberg REST catalog (apache/iceberg-rest-fixture in docker) +
      # MinIO — validates against genuine catalog responses. Skips without docker.
      - name: DataLakeCatalog against a real REST catalog (mt)
        env:
          ICEBERG_PY: ${{ github.workspace }}/.iceberg-venv/bin/python
          MINIO_BIN: ${{ github.workspace }}/.bin/minio
          CHDB_WASM_MJS: ${{ github.workspace }}/buildwasm/programs/wasm/chdb.mjs
        run: node packages/chdb-wasm/test/datalake-real-catalog.test.mjs

      # puppeteer's bundled Chrome needs these system shared libraries (libatk,
      # libnss3, libgbm, ...); the self-hosted runner does not preinstall them.
      # Install per-package with `|| true` so Ubuntu 24.04's t64 ABI renames
      # (libasound2 -> libasound2t64, etc.) don't abort the whole batch.
      - name: Install headless-Chrome runtime libraries
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          for p in \
            libnss3 libnspr4 libdbus-1-3 libxkbcommon0 libdrm2 libgbm1 \
            libxcomposite1 libxdamage1 libxfixes3 libxrandr2 libxext6 \
            libxcb1 libx11-6 libxshmfence1 fonts-liberation \
            libglib2.0-0 libglib2.0-0t64 libexpat1 \
            libxrender1 libxtst6 libxi6 libxcursor1 \
            libatk1.0-0 libatk1.0-0t64 \
            libatk-bridge2.0-0 libatk-bridge2.0-0t64 \
            libcups2 libcups2t64 \
            libasound2 libasound2t64 \
            libpango-1.0-0 libpangocairo-1.0-0 libcairo2 \
            libgtk-3-0 libgtk-3-0t64; do
            sudo apt-get -o DPkg::Lock::Timeout=600 install -y --no-install-recommends "$p" || true
          done

      # Build the npm dist (both bundles -> dist/ + dist/st/) and run the headless
      # Chrome test: an isolated page must pick mt, a non-isolated page must pick st.
      - name: Build npm package + headless-Chrome test (mt + st)
        working-directory: packages/chdb-wasm
        run: |
          npm install --no-audit --no-fund
          npm run build
          ls -la dist/chdb.wasm dist/st/chdb.wasm
          node test/browser-run.mjs

      # Same DataLakeCatalog flow inside a cross-origin-isolated Chrome page
      # (exercises the sync-XHR transport branch; Node uses a different one).
      - name: DataLakeCatalog headless-Chrome test
        working-directory: packages/chdb-wasm
        env:
          ICEBERG_PY: ${{ github.workspace }}/.iceberg-venv/bin/python
        run: node test/datalake-browser-run.mjs

      # Keep the artifact for download/inspection (kept short to save storage).
      - name: Upload wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: chdb-wasm
          path: |
            buildwasm/programs/wasm/chdb.mjs
            buildwasm/programs/wasm/chdb.wasm
          retention-days: 7
          if-no-files-found: error

      # ---- wasm-split lazy-loading pipeline (tools/split/README.md). Runs AFTER
      # the npm dist build + artifact upload: the relink turns the build trees'
      # chdb.wasm into the profiling-INSTRUMENTED module (copy-artifacts refuses
      # such a tree by design), so dist/ must be final before this point. Sits
      # before the tag-publish steps on purpose — if split ever regresses, a
      # release run goes red instead of shipping quietly. Adds ~25min: two
      # relinks (objects are reused), profiling runs, two wasm-split invocations.
      - name: Relink with WASM_SPLIT_MODULE=ON (both bundles)
        run: |
          source "${EMSDK}/emsdk_env.sh"
          cmake -DWASM_SPLIT_MODULE=ON buildwasm >/dev/null
          ninja -C buildwasm chdb_wasm
          cmake -DWASM_SPLIT_MODULE=ON buildwasm-st >/dev/null
          ninja -C buildwasm-st chdb_wasm
          ls -la buildwasm/programs/wasm/chdb.wasm.orig buildwasm-st/programs/wasm/chdb.wasm.orig

      # st first: its single instance sees the whole pipeline execute inline, so
      # its hot set is complete; the mt split mixes it in via --extra-hot (mt
      # pool workers park in Atomics.wait and are invisible to profiling).
      - name: wasm-split pipeline (profile + split, st hot-set -> mt)
        env:
          ICEBERG_PY: ${{ github.workspace }}/.iceberg-venv/bin/python
        run: |
          export WASM_SPLIT="${EMSDK}/upstream/bin/wasm-split"
          node packages/chdb-wasm/tools/split/split-wasm.mjs \
            --build buildwasm-st/programs/wasm --out "${GITHUB_WORKSPACE}/split-out-st" \
            --emit-hot-names "${GITHUB_WORKSPACE}/split-out-st/hot-names.txt"
          node packages/chdb-wasm/tools/split/split-wasm.mjs \
            --build buildwasm/programs/wasm --out "${GITHUB_WORKSPACE}/split-out-mt" \
            --extra-hot "${GITHUB_WORKSPACE}/split-out-st/hot-names.txt"

      - name: Split bundle tests
        env:
          CHDB_SPLIT_MT_DIR: ${{ github.workspace }}/split-out-mt
          CHDB_SPLIT_ST_DIR: ${{ github.workspace }}/split-out-st
        run: node packages/chdb-wasm/test/split.test.mjs

      - name: Upload split wasm artifact
        uses: actions/upload-artifact@v4
        with:
          name: chdb-wasm-split
          path: |
            split-out-mt/chdb.mjs
            split-out-mt/chdb.wasm
            split-out-mt/chdb.deferred.wasm
            split-out-st/chdb.mjs
            split-out-st/chdb.wasm
            split-out-st/chdb.deferred.wasm
          retention-days: 1
          if-no-files-found: error

      # ---- chdb-cloudflare: a single-file bundle sized for Cloudflare Workers
      # (10 MiB gzipped Worker limit). The st tree is relinked once more with a
      # 64MB initial memory (a Workers isolate caps total memory at 128MB) and
      # WASM_JSPI=ON (the async-fetch HTTP bridge — the only transport that
      # works in workerd, so url()/s3() run inside Workers; requires a
      # JSPI-capable engine: Chrome 137+, workerd, Node with
      # --experimental-wasm-jspi, which the split tooling adds to child
      # processes automatically). Split against the LITE corpus (most-common
      # SQL only); only the primary ships, with the --lite glue so
      # out-of-corpus calls throw a clear error. Runs after the full-split
      # steps because it reuses (and re-links) the buildwasm-st tree; the full
      # packages stay JSPI-free (their sync-XHR bridge needs no special engine
      # support).
      - name: Relink st with 64MB initial memory + JSPI (lite)
        run: |
          source "${EMSDK}/emsdk_env.sh"
          cmake -DWASM_SPLIT_MODULE=ON -DWASM_INITIAL_MEMORY=64MB -DWASM_JSPI=ON buildwasm-st >/dev/null
          ninja -C buildwasm-st chdb_wasm

      - name: Lite split pipeline (lite corpus, primary-only)
        run: |
          export WASM_SPLIT="${EMSDK}/upstream/bin/wasm-split"
          # CHDB_SKIP_LAKE: the lite corpus has no data-lake statements; skip
          # the moto/pyiceberg fixtures (the static HTTP server for url()/s3()
          # still runs).
          CHDB_SKIP_LAKE=1 node packages/chdb-wasm/tools/split/split-wasm.mjs \
            --build buildwasm-st/programs/wasm --out "${GITHUB_WORKSPACE}/split-out-lite" \
            --corpus "${GITHUB_WORKSPACE}/packages/chdb-wasm/tools/split/profile-corpus-lite.sql" \
            --extra-keep "${GITHUB_WORKSPACE}/packages/chdb-wasm/tools/split/keep-lite.txt" \
            --lite-glue

      - name: Build + test chdb-cloudflare package (incl. size gate)
        working-directory: packages/chdb-cloudflare
        run: |
          node scripts/build-lite.mjs "${GITHUB_WORKSPACE}/split-out-lite"
          node test/lite.test.mjs
          node test/matrix.test.mjs

      - name: Upload lite artifact
        uses: actions/upload-artifact@v4
        with:
          name: chdb-cloudflare
          path: packages/chdb-cloudflare/dist
          retention-days: 1
          if-no-files-found: error

      # ---- Publish to npm, only on a v* tag. Everything above (build + all Node
      # and headless-Chrome tests) ran first, so a tag that fails tests never ships.
      # dist/ is already built by the npm step above; the version is taken from the tag. ----
      # ---- npm publish: MANUAL ONLY. Run the workflow via workflow_dispatch with
      # `publish` checked and a `version`; everything above (build, the full test
      # matrix, the split pipeline) must have passed to reach here. Tag-driven
      # publishing stays disabled (was: startsWith(github.ref, 'refs/tags/v')).
      # Each package publishes independently: fill `version` for chdb-wasm,
      # `cloudflare_version` for chdb-cloudflare, either, or both. Checking `publish`
      # with both empty fails loudly instead of silently doing nothing.
      - name: Validate publish inputs
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          VERSION: ${{ inputs.version }}
          LITE_VERSION: ${{ inputs.cloudflare_version }}
        run: |
          [[ -n "$VERSION" || -n "$LITE_VERSION" ]] \
            || { echo "publish is checked but both 'version' and 'cloudflare_version' are empty — nothing to publish"; exit 1; }
          [[ -z "$VERSION" || "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]] \
            || { echo "'version' must be semver, got: '$VERSION'"; exit 1; }
          [[ -z "$LITE_VERSION" || "$LITE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-.+)?$ ]] \
            || { echo "'cloudflare_version' must be semver, got: '$LITE_VERSION'"; exit 1; }

      - name: Set npm version (manual publish)
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.version != ''
        working-directory: packages/chdb-wasm
        env:
          VERSION: ${{ inputs.version }}
        run: |
          echo "Publishing chdb-wasm@$VERSION"
          npm pkg set version="$VERSION"

      - name: Publish to npm
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.version != ''
        working-directory: packages/chdb-wasm
        env:
          VERSION: ${{ inputs.version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          # setup-node was not given registry-url, so NODE_AUTH_TOKEN alone is
          # inert; write the registry auth explicitly.
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          # Prerelease tags (e.g. v0.2.0-beta.1, semver versions containing '-') go
          # under the `next` dist-tag so `npm install chdb-wasm` (which resolves
          # `latest`) keeps getting the last STABLE release; stable tags get `latest`.
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          # Pack the exact tarball we publish (dist/, incl. the embedded wasm, is already
          # built above) so the GitHub release asset is byte-identical to what's on npm.
          npm pack
          TGZ="chdb-wasm-${VERSION}.tgz"
          echo "publishing $TGZ under dist-tag '$TAG'"
          npm publish "$TGZ" --tag "$TAG"
          # Hand the tarball path to the release-upload step below.
          echo "CHDB_TGZ=${GITHUB_WORKSPACE}/packages/chdb-wasm/${TGZ}" >> "$GITHUB_ENV"

      # chdb-cloudflare is versioned independently of chdb-wasm: pass
      # cloudflare_version to publish it (empty skips it, so either package can be
      # released on its own).
      - name: Publish chdb-cloudflare to npm
        if: github.event_name == 'workflow_dispatch' && inputs.publish && inputs.cloudflare_version != ''
        working-directory: packages/chdb-cloudflare
        env:
          VERSION: ${{ inputs.cloudflare_version }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          npm config set //registry.npmjs.org/:_authToken "${NODE_AUTH_TOKEN}"
          npm pkg set version="$VERSION"
          if [[ "$VERSION" == *-* ]]; then TAG=next; else TAG=latest; fi
          npm pack
          echo "publishing chdb-cloudflare-${VERSION}.tgz under dist-tag '$TAG'"
          npm publish "chdb-cloudflare-${VERSION}.tgz" --tag "$TAG"

      # Best-effort: attach the published npm tarball (chdb-wasm-<version>.tgz — it embeds
      # both wasm bundles) to the GitHub release, creating the release if the tag has none
      # yet. continue-on-error — the npm publish above is the real deliverable.
      - name: Attach the npm tarball to the GitHub release
        # Tag runs only (a manual-dispatch publish has no tag/release to attach
        # to) and tag-driven distribution stays disabled for now
        # (was: startsWith(github.ref, 'refs/tags/v')).
        if: false
        continue-on-error: true
        run: |
          gh release upload "${GITHUB_REF_NAME}" "${CHDB_TGZ}" --clobber \
            || gh release create "${GITHUB_REF_NAME}" "${CHDB_TGZ}" --title "${GITHUB_REF_NAME}" --notes "chdb-wasm ${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
