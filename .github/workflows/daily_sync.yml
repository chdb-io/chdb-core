name: Daily ClickHouse sync

# Brings ClickHouse master into main once every weekday. It picks the newest master
# commit upstream CI passed, applies the diff since UPSTREAM_COMMIT to the paths
# chDB keeps, builds chDB and runs its Python tests on Python 3.14. When the diff
# conflicts, or the build or the tests fail, Claude Code takes over on the same
# build machine: it resolves the conflicts, fixes what the sync broke until the
# build and the tests pass, and writes down what it did. The result becomes a pull
# request that a person approves and merges. A separate job opens it, so the
# build machine, where Claude Code runs shell commands, never holds the token that
# can push.
#
# While a sync pull request is open the run does nothing, so a review is never
# overwritten, and the nightly builds wait too; the next sync after it merges
# covers the days in between.
# See .github/nightly/README.md for setup and for running a step by hand.

on:
  schedule:
    # 06:17 in Beijing, Monday to Friday. The self-hosted runners restart for package
    # updates around 06:00 UTC, so a long run has to start well before.
    - cron: '17 22 * * 0-4'
  workflow_dispatch:
    inputs:
      target:
        description: 'Upstream commit to sync to (default: the newest master commit that passed MasterCI)'
        required: false
        default: ''
      dry_run:
        description: 'Stop before pushing or opening a pull request'
        type: boolean
        default: false

concurrency:
  group: daily-clickhouse-sync
  cancel-in-progress: false

permissions:
  contents: read

env:
  SYNC_BRANCH: sync/clickhouse-master
  SYNC_WORK: ${{ github.workspace }}/../clickhouse-sync

jobs:
  sync:
    # Scheduled runs stay off until DAILY_SYNC_ENABLED is set; a dispatch always runs.
    if: github.event_name == 'workflow_dispatch' || vars.DAILY_SYNC_ENABLED == 'true'
    # It builds chDB, so it runs where the sync pull request's own CI does.
    runs-on: [self-hosted, linux, x64, ubuntu-latest]
    timeout-minutes: 1200
    permissions:
      contents: read
      pull-requests: read   # the open sync pull request the run waits for
    outputs:
      ready: ${{ steps.stage.outputs.ready }}
    steps:
      - name: Install GitHub CLI
        run: |
          command -v gh >/dev/null && exit 0
          cd "$RUNNER_TEMP"
          wget -q https://github.com/cli/cli/releases/download/v2.82.1/gh_2.82.1_linux_amd64.tar.gz -O gh.tar.gz
          tar -xf gh.tar.gz
          sudo cp gh_*/bin/gh /usr/local/bin/
          gh --version

      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - name: Wait while a sync pull request is open
        id: open
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          count=$(gh pr list --repo "$GITHUB_REPOSITORY" --head "$SYNC_BRANCH" --state open --json number --jq length)
          echo "count=$count" >> "$GITHUB_OUTPUT"
          if [ "$count" != 0 ]; then
            echo "::notice::A sync pull request is still open; nothing to do until it merges or closes."
          fi

      - name: Fetch ClickHouse
        if: steps.open.outputs.count == '0'
        run: python3 .github/nightly/daily_sync.py fetch --work "$SYNC_WORK" --target "${{ inputs.target }}"

      - name: Choose the upstream commit
        id: target
        if: steps.open.outputs.count == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 .github/nightly/daily_sync.py target --work "$SYNC_WORK" --override "${{ inputs.target }}"

      - name: Apply the upstream diff
        id: apply
        if: steps.target.outputs.up_to_date == 'false'
        env:
          SYNC_TARGET_REASON: ${{ steps.target.outputs.reason }}
        run: python3 .github/nightly/daily_sync.py apply --work "$SYNC_WORK" --target "${{ steps.target.outputs.target }}"

      # The pull request's first commit: the diff as applied, conflict markers and all.
      - name: Record the applied sync
        if: steps.apply.outcome == 'success'
        run: python3 .github/nightly/daily_sync.py snapshot

      # The build environment of build_linux_x86_wheels.yml, with Python 3.9 to build
      # (chdb/build.sh requires it) and 3.14 to test.
      - name: Install the toolchain
        if: steps.apply.outcome == 'success'
        run: |
          cd "$RUNNER_TEMP"
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y make build-essential libssl-dev zlib1g-dev \
            libbz2-dev libreadline-dev wget curl llvm libncursesw5-dev xz-utils tk-dev libxml2-dev \
            libxmlsec1-dev libffi-dev liblzma-dev libsqlite3-dev golang-go liblz4-dev
          wget -q https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y cmake ccache ninja-build yasm gawk lld-21
          sudo ln -sf /usr/bin/clang-21 /usr/bin/clang
          sudo ln -sf /usr/bin/clang++-21 /usr/bin/clang++
          wget -q https://github.com/NixOS/patchelf/releases/download/0.18.0/patchelf-0.18.0-x86_64.tar.gz -O patchelf.tar.gz
          mkdir -p patchelf
          tar -xf patchelf.tar.gz -C patchelf
          sudo cp patchelf/bin/patchelf /usr/bin/
          rustup toolchain install nightly-2026-03-22
          rustup default nightly-2026-03-22
          rustup component add rust-src

      - name: Install Python 3.9 and 3.14
        if: steps.apply.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          rm -rf "$HOME/.pyenv"
          # Authenticated: anonymous clones get rate-limited on the pool's shared egress IP.
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GITHUB_TOKEN" | base64 | tr -d '\n')" \
            git clone --depth 1 https://github.com/pyenv/pyenv.git "$HOME/.pyenv"
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv install 3.9:latest
          pyenv install 3.14:latest
          pyenv global 3.9 3.14
          for version in 3.9 3.14; do
            if [ "$version" = 3.9 ]; then polars=polars==1.10.0; else polars=polars; fi
            PYENV_VERSION=$version python -m pip install --upgrade pip
            PYENV_VERSION=$version python -m pip install setuptools tox pandas pyarrow twine psutil deltalake wheel \
              jupyter nbconvert "fastjsonschema<2.22" "$polars"
          done

      - name: ccache
        if: steps.apply.outcome == 'success'
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ubuntu-22.04-x86_64
          max-size: 5G
          append-timestamp: true

      # After the apply, so submodules the sync bumps or adds come at their new pins.
      - name: Update submodules
        if: steps.apply.outcome == 'success'
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: .github/scripts/update-submodules.sh

      - name: Build and test
        id: build
        if: steps.apply.outputs.status == 'clean'
        run: |
          if bash .github/nightly/build_and_test.sh; then
            echo "result=pass" >> "$GITHUB_OUTPUT"
          else
            echo "result=fail" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-node@v7
        if: steps.apply.outputs.status == 'conflicts' || steps.build.outputs.result == 'fail'
        with:
          node-version: 22

      - name: Finish the sync with Claude Code
        if: steps.apply.outputs.status == 'conflicts' || steps.build.outputs.result == 'fail'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MODEL: ${{ vars.SYNC_CLAUDE_MODEL || 'claude-opus-5-5' }}
          # A full build takes about an hour; let a single command run for up to three.
          BASH_DEFAULT_TIMEOUT_MS: '10800000'
          BASH_MAX_TIMEOUT_MS: '10800000'
        run: |
          npm install --global @anthropic-ai/claude-code@2
          status=0
          claude -p "$(cat .github/nightly/resolve_prompt.md)" \
            --model "$MODEL" \
            --effort max \
            --max-turns 500 \
            --permission-mode dontAsk \
            --allowedTools "Bash,Read,Edit,Write,Grep,Glob,TodoWrite" \
            --output-format json > "$RUNNER_TEMP/claude.json" || status=$?
          python3 -c 'import json,sys; r=json.load(open(sys.argv[1])); print(r.get("result","")[-4000:])' \
            "$RUNNER_TEMP/claude.json" || true
          if [ "$status" != 0 ]; then
            echo "::warning::Claude Code exited with status $status; the pull request shows where the sync stands."
          fi
          echo "Claude Code" > .sync/changed_by

      # A report for the reviewer; nothing here stops the pull request.
      - name: Check the sync
        if: steps.apply.outcome == 'success'
        run: python3 .github/nightly/checks.py all --work "$SYNC_WORK"

      - name: Stage the sync
        id: stage
        if: steps.apply.outcome == 'success'
        run: |
          python3 .github/nightly/daily_sync.py stage
          echo "ready=true" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v7
        if: always() && steps.apply.outcome != 'skipped'
        with:
          name: sync-${{ github.run_id }}
          path: .sync/
          include-hidden-files: true
          if-no-files-found: ignore
          retention-days: 14

  publish:
    needs: sync
    if: needs.sync.outputs.ready == 'true' && !inputs.dry_run
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          persist-credentials: false

      - uses: actions/download-artifact@v8
        with:
          name: sync-${{ github.run_id }}
          path: .sync

      - name: Commit, push and open the pull request
        env:
          SYNC_PAT: ${{ secrets.SYNC_PAT }}
        run: |
          echo "/.sync/" >> "$(git rev-parse --git-path info/exclude)"
          .github/nightly/open_pr.sh
