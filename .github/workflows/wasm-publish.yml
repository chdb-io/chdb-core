# Publish @chdb/chdb-wasm to npm on a v* tag (the npm analog of the wheel
# release flow). Builds the wasm, bundles it into the package's dist/, sets the
# version from the tag, and runs `npm publish`. The .wasm ships inside the npm
# package (like duckdb-wasm).
#
# Requires repo secret NPM_TOKEN (an npm automation token with publish rights to
# the @chdb scope). Adjust the package name/scope in packages/chdb-wasm/package.json
# if @chdb is not the intended npm org.
name: wasm-publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to publish (e.g. 0.1.0). Defaults to package.json.'
        required: false

concurrency:
  group: wasm-publish-${{ github.ref }}
  cancel-in-progress: false

env:
  EMSDK_VERSION: '5.0.7'
  NODE_VERSION: '24'

jobs:
  publish:
    runs-on: [self-hosted, linux, x64, ubuntu-latest]
    timeout-minutes: 120
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld ninja-build ccache

      # emcmake needs a recent cmake on PATH (not provided by the runner for this job).
      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Setup Emscripten ${{ env.EMSDK_VERSION }} (cached)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache-${{ env.EMSDK_VERSION }}

      - name: Cache ccache
        uses: actions/cache@v4
        with:
          path: ~/.ccache
          key: wasm-ccache-${{ github.sha }}
          restore-keys: |
            wasm-ccache-

      - name: Setup Node ${{ env.NODE_VERSION }} (npm registry auth)
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: 'https://registry.npmjs.org'

      - name: Build chdb_wasm
        env:
          COMPILER_CACHE: ccache
          CCACHE_DIR: /home/runner/.ccache
          CCACHE_MAXSIZE: 5G
        run: |
          source "${EMSDK}/emsdk_env.sh"
          # Both bundles ship in the npm package: threaded (-> buildwasm, dist/) and
          # single-threaded (-> buildwasm-st, dist/st/). copy-artifacts picks up both.
          chdb/build-wasm.sh build
          BUILD_DIR="${GITHUB_WORKSPACE}/buildwasm-st" WASM_THREADS=OFF chdb/build-wasm.sh build
          ls -la buildwasm/programs/wasm/chdb.wasm buildwasm-st/programs/wasm/chdb.wasm

      - name: Resolve version
        id: ver
        run: |
          if [ "${GITHUB_REF}" != "${GITHUB_REF#refs/tags/v}" ]; then
            echo "version=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.version }}" ]; then
            echo "version=${{ github.event.inputs.version }}" >> "$GITHUB_OUTPUT"
          else
            echo "version=" >> "$GITHUB_OUTPUT"
          fi

      - name: Build npm package (tsc -> dist, bundle wasm)
        working-directory: packages/chdb-wasm
        run: |
          [ -n "${{ steps.ver.outputs.version }}" ] && npm pkg set version="${{ steps.ver.outputs.version }}"
          npm install --no-audit --no-fund
          npm run build
          echo "=== dist ==="; ls -la dist/chdb.mjs dist/chdb.wasm dist/index.js dist/st/chdb.wasm
          echo "publishing $(npm pkg get name)@$(npm pkg get version)"

      - name: Publish to npm
        working-directory: packages/chdb-wasm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # Best-effort: attach the wasm to the GitHub release (create it if the tag
      # has none yet). Never fails the job — npm publish above is the real deliverable.
      - name: Attach wasm artifacts to the GitHub release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          A=buildwasm/programs/wasm/chdb.wasm
          B=buildwasm/programs/wasm/chdb.mjs
          gh release upload "${GITHUB_REF_NAME}" "$A" "$B" --clobber \
            || gh release create "${GITHUB_REF_NAME}" "$A" "$B" --title "${GITHUB_REF_NAME}" --notes "chdb-wasm ${GITHUB_REF_NAME}"
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
