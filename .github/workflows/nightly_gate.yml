name: Nightly gate

# Whether a push to main merges a ClickHouse sync pull request, which makes main's
# build of it the nightly. Called by the four wheel workflows, the free-threaded
# wheels and wasm. However the pull request was merged (squash, merge commit or
# rebase), the push carries a commit titled like the sync's first commit,
# "Sync ClickHouse master up to <commit>"; publish.py asks the same of the commit
# and its pull request.

on:
  workflow_call:
    outputs:
      nightly:
        description: "'true' when the push merges a ClickHouse sync"
        value: ${{ jobs.check.outputs.nightly }}

permissions: {}

jobs:
  check:
    name: Check the push
    runs-on: ubuntu-latest
    outputs:
      nightly: ${{ steps.check.outputs.nightly }}
    steps:
      - id: check
        run: |
          count=$(jq '[.commits[]?.message | select(startswith("Sync ClickHouse master up to "))] | length' "$GITHUB_EVENT_PATH")
          echo "nightly=$([ "$count" -gt 0 ] && echo true || echo false)" >> "$GITHUB_OUTPUT"
