name: Deploy wasm shell to Cloudflare

# Manual-only. This workflow NEVER runs automatically — not on push, pull_request,
# merge to main, or tag. It runs only when triggered by hand (workflow_dispatch),
# to deploy the browser shell (web page) + the wasm engine to Cloudflare.
on:
  workflow_dispatch:
    inputs:
      chdb_wasm_version:
        description: 'chdb-wasm npm version to deploy (engine + glue), or "latest"'
        required: false
        default: 'latest'
      pages_project:
        description: 'Cloudflare Pages project name'
        required: false
        default: 'chdb-shell'
      r2_bucket:
        description: 'Cloudflare R2 bucket name (holds the .wasm)'
        required: false
        default: 'chdb-wasm'

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    # Requires repo secrets (added by the Cloudflare account owner):
    #   CLOUDFLARE_API_TOKEN  — Cloudflare Pages: Edit  +  Workers R2 Storage: Edit
    #   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
    # And, one-time on the Pages project: an R2 binding named WASM_BUCKET, plus the
    # custom domain (e.g. wasm.chdb.io).
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch chdb-wasm dist (engine + glue) from npm
        run: |
          set -eux
          npm pack "chdb-wasm@${{ inputs.chdb_wasm_version }}"
          mkdir -p _pkg && tar xzf chdb-wasm-*.tgz -C _pkg
          echo "DIST=$PWD/_pkg/package/dist" >> "$GITHUB_ENV"

      - name: Assemble the Cloudflare bundle (pages/ + r2/)
        run: bash packages/chdb-wasm/scripts/build-cf-bundle.sh "$DIST" packages/chdb-wasm/web out

      - name: Upload wasm to R2
        run: |
          set -eux
          cd out/r2
          find . -name '*.wasm' | sed 's#^\./##' | while read -r key; do
            npx --yes wrangler r2 object put "${{ inputs.r2_bucket }}/$key" \
              --file "$key" --content-type application/wasm --remote
          done

      - name: Deploy Pages
        run: npx --yes wrangler pages deploy out/pages --project-name "${{ inputs.pages_project }}"
