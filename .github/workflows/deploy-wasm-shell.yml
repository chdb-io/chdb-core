name: Deploy wasm shell to Cloudflare

# Manual-only. This workflow NEVER runs automatically — not on push, pull_request,
# merge to main, or tag. It runs only when triggered by hand (workflow_dispatch).
# It builds chdb-wasm FROM SOURCE in this repo, then deploys the browser shell
# (web page) + the wasm engine to Cloudflare: Pages for the small files, R2 for
# the large .wasm.
on:
  workflow_dispatch:
    inputs:
      pages_project:
        description: 'Cloudflare Pages project name (as created in the dashboard)'
        required: false
        default: 'chdb-shell'
      r2_bucket:
        description: 'Cloudflare R2 bucket name (holds the .wasm; bound to Pages as WASM_BUCKET)'
        required: false
        default: 'chdb-wasm'

permissions:
  contents: read

env:
  EMSDK_VERSION: '5.0.7'   # match the wasm build job
  NODE_VERSION: '24'       # Memory64 (-sMEMORY64) needs V8 from Node >= 23

jobs:
  deploy:
    # Same self-hosted runner as the wasm build job: building chdb for wasm needs the
    # Emscripten toolchain, ccache, and disk that the GitHub-hosted images do not provide.
    runs-on: [self-hosted, linux, x64, ubuntu-latest]
    timeout-minutes: 120
    # Requires repo secrets (added by the Cloudflare account owner):
    #   CLOUDFLARE_API_TOKEN  — Cloudflare Pages: Edit  +  Workers R2 Storage: Edit
    #   CLOUDFLARE_ACCOUNT_ID — the Cloudflare account id
    # The Pages project must already exist with an R2 binding named WASM_BUCKET and the
    # custom domain (e.g. wasm.chdb.io) — these are configured once, in the dashboard.
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Checkout (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lld ninja-build ccache

      - name: Setup CMake + Ninja
        uses: lukka/get-cmake@latest

      - name: Setup Emscripten ${{ env.EMSDK_VERSION }} (cached)
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: ${{ env.EMSDK_VERSION }}
          actions-cache-folder: emsdk-cache-${{ env.EMSDK_VERSION }}

      - name: Setup Node ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Build chdb_wasm from source (threaded + single-threaded)
        run: |
          source "${EMSDK}/emsdk_env.sh"
          # Threaded bundle (WASM_THREADS=ON) -> buildwasm/
          chdb/build-wasm.sh build
          # Single-threaded bundle (WASM_THREADS=OFF) -> buildwasm-st/
          BUILD_DIR="${GITHUB_WORKSPACE}/buildwasm-st" WASM_THREADS=OFF chdb/build-wasm.sh build
          ls -la buildwasm/programs/wasm/chdb.wasm buildwasm-st/programs/wasm/chdb.wasm

      - name: Build npm package (dist/: glue JS + both wasm bundles)
        working-directory: packages/chdb-wasm
        run: |
          npm install --no-audit --no-fund
          npm run build
          ls -la dist/chdb.wasm dist/st/chdb.wasm

      - name: Assemble the Cloudflare bundle (pages/ + r2/)
        run: bash packages/chdb-wasm/scripts/build-cf-bundle.sh packages/chdb-wasm/dist packages/chdb-wasm/web out

      - name: Upload wasm to R2
        run: |
          set -eux
          cd out/r2
          find . -name '*.wasm' | sed 's#^\./##' | while read -r key; do
            npx --yes wrangler r2 object put "${{ inputs.r2_bucket }}/$key" \
              --file "$key" --content-type application/wasm --remote
          done

      - name: Deploy Pages
        run: npx --yes wrangler pages deploy out/pages --project-name "${{ inputs.pages_project }}"
