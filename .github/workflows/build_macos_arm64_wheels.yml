name: Build & Test macOS arm64

on:
  workflow_dispatch:
    inputs:
      TAG_NAME:
        description: 'Release Version Tag'
        required: true
      DEBUG_MODE:
        description: 'Enable debug mode (Debug build, lldb tests, skip static lib)'
        required: false
        default: 'true'
        type: boolean
  release:
    types: [published]
  push:
    branches:
      - main
    paths-ignore:
      - '**/*.md'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches:
      - main
    paths-ignore:
      - '**/*.md'

concurrency:
  # Superseded PR pushes stack multi-hour builds onto a small self-hosted pool,
  # starving later runs. Never cancel main or release runs.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # DEBUG_MODE disabled for all builds
  EFFECTIVE_DEBUG_MODE: 'false'

jobs:
  build_universal_wheel_on_linux:
    name: Build on Linux (cross-compile for macOS arm64)
    runs-on: [self-hosted, linux, arm64, ubuntu-latest]
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 600
    steps:
      - name: Install Python build dependencies
        run: |
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y make build-essential libssl-dev zlib1g-dev \
            libbz2-dev libreadline-dev libsqlite3-dev wget curl llvm \
            libncursesw5-dev xz-utils tk-dev libxml2-dev libxmlsec1-dev \
            libffi-dev liblzma-dev p7zip-full
      - name: Upgrade Rust toolchain
        run: |
          rustup toolchain install nightly-2026-03-22
          rustup default nightly-2026-03-22
          rustup component add rust-src
          rustc --version
          cargo --version
      - name: Install clang++ for Ubuntu
        run: |
          pwd
          uname -a
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh 21
          which clang++-21
          clang++-21 --version
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y make cmake ccache ninja-build yasm gawk wget
          # Install WebAssembly linker (wasm-ld)
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y lld-21
          # Create symlink for wasm-ld
          if ! command -v wasm-ld &> /dev/null; then
            sudo ln -sf /usr/bin/wasm-ld-21 /usr/bin/wasm-ld || true
          fi
          which wasm-ld || echo "wasm-ld not found in PATH"
          ccache -s
      - name: Update git
        run: |
          sudo add-apt-repository ppa:git-core/ppa -y
          sudo apt-get -o DPkg::Lock::Timeout=600 update
          sudo apt-get -o DPkg::Lock::Timeout=600 install -y git
          git --version
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Update submodules
        run: |
          git submodule update --init --recursive --jobs 4
      - name: ccache
        uses: hendrikmuhs/ccache-action@v1.2.23
        with:
          key: ubuntu-24.04-aarch64-cross-compile
          max-size: 5G
          append-timestamp: true
      - name: remove old clang and link clang-21 to clang
        run: |
          sudo rm -f /usr/bin/clang || true
          sudo ln -s /usr/bin/clang-21 /usr/bin/clang
          sudo rm -f /usr/bin/clang++ || true
          sudo ln -s /usr/bin/clang++-21 /usr/bin/clang++
          which clang++
          clang++ --version
      - name: Run chdb/build_mac_on_linux.sh
        timeout-minutes: 600
        run: |
          source ~/.cargo/env
          # Use Debug for crash analysis when DEBUG_MODE is enabled
          if [ "${{ env.EFFECTIVE_DEBUG_MODE }}" == "true" ]; then
            bash ./chdb/build_mac_on_linux.sh arm64 Debug
          else
            bash ./chdb/build_mac_on_linux.sh arm64
          fi
        continue-on-error: false
      - name: Run chdb/build/build_static_lib_mac_on_linux.sh
        if: env.EFFECTIVE_DEBUG_MODE != 'true'
        timeout-minutes: 600
        run: |
          source ~/.cargo/env
          bash ./chdb/build/build_static_lib_mac_on_linux.sh arm64
      #   continue-on-error: false
      - name: Check ccache statistics
        run: |
          ccache -s
          ls -lh chdb
          df -h
      # Free-threading wheels live in .github/workflows/build_ft_wheels.yml.
      - name: Keep killall ccache and wait for ccache to finish
        if: always()
        run: |
          sleep 60
          while ps -ef | grep ccache | grep -v grep; do \
            killall ccache; \
            sleep 10; \
          done
      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-build-artifacts
          path: |
            ./libchdb.so
            ./libchdb.so.dSYM
            ./libchdb.a
            ./_chdb.abi3.so.dSYM
            ./chdb/_chdb.abi3.so
            ./chdb/libpybind11nonlimitedapi_stubs.dylib
            ./chdb/libpybind11nonlimitedapi_chdb_3.9.dylib
            ./chdb/libpybind11nonlimitedapi_chdb_3.10.dylib
            ./chdb/libpybind11nonlimitedapi_chdb_3.11.dylib
            ./chdb/libpybind11nonlimitedapi_chdb_3.12.dylib
            ./chdb/libpybind11nonlimitedapi_chdb_3.13.dylib
            ./chdb/libpybind11nonlimitedapi_chdb_3.14.dylib
          retention-days: 1
      # ---------------------------------------------------------------------
      # chdb-core-lite cross-compile: only the Python module (_chdb.abi3.so);
      # libchdb.so / pybind11 dylibs are reused from the chdb-core build.
      # ---------------------------------------------------------------------
      - name: Build chdb-core-lite (cross-compile for macOS arm64)
        if: env.EFFECTIVE_DEBUG_MODE != 'true'
        timeout-minutes: 600
        run: |
          source ~/.cargo/env
          # Hermetic re-configure under CHDB_LITE=1
          rm -rf build-darwin-arm64
          CHDB_LITE=1 bash ./chdb/build_mac_on_linux.sh arm64
          # The lite build overwrote chdb/_chdb.abi3.so; save it under a
          # distinct name so the chdb-core artifact uploaded above is unaffected.
          mv chdb/_chdb.abi3.so chdb/_chdb-lite.abi3.so
          ls -lh chdb/_chdb-lite.abi3.so
        continue-on-error: false
      - name: Upload chdb-core-lite build artifact
        if: env.EFFECTIVE_DEBUG_MODE != 'true'
        uses: actions/upload-artifact@v7
        with:
          name: macos-arm64-build-artifacts-lite
          path: ./chdb/_chdb-lite.abi3.so
          retention-days: 1

  test_on_macos:
    name: Test on macOS arm64
    runs-on: macos-14-xlarge
    needs: build_universal_wheel_on_linux
    if: ${{ !github.event.pull_request.draft }}
    timeout-minutes: 600
    steps:
      - name: Check machine architecture
        run: |
          echo "=== Machine Architecture Information ==="
          echo "Machine type: $(uname -m)"
          echo "Architecture: $(arch)"
          echo "System info: $(uname -a)"
          echo "Hardware info:"
          system_profiler SPHardwareDataType | grep "Chip\|Processor"
          if sysctl -n hw.optional.arm64 2>/dev/null | grep -q "1"; then
            echo "This is an ARM64 (Apple Silicon) machine"
          else
            echo "This is an x86_64 (Intel) machine"
          fi
      - name: Setup pyenv
        run: |
          curl https://pyenv.run | bash
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"

          pyenv install 3.9:latest
          pyenv install 3.10:latest
          pyenv install 3.11:latest
          pyenv install 3.12:latest
          pyenv install 3.13:latest
          pyenv install 3.14:latest
          pyenv global 3.9 3.10 3.11 3.12 3.13 3.14

          echo "Installed versions:"
          pyenv versions
      - name: Verify pyenv installations
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          echo "Installed Python versions:"
          pyenv versions
          echo ""
          echo "Verifying all required Python versions are available:"
          for version in 3.9 3.10 3.11 3.12 3.13 3.14; do
            if ! pyenv versions --bare | grep -q "^$version"; then
              echo "ERROR: Python $version is not installed!"
              exit 1
            fi
            echo "✓ Python $version is installed"
          done
          echo "All Python versions verified successfully!"
      - name: Install dependencies for all Python versions
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          for version in 3.9 3.10 3.11 3.12 3.13 3.14; do
            echo "Installing dependencies for Python $version"
            pyenv shell $version
            python -m pip install --upgrade pip
            python -m pip install setuptools wheel tox pandas pyarrow twine psutil deltalake wheel>=0.40.0 jupyter nbconvert "fastjsonschema<2.22"
            # numba (via llvmlite) bundles its own libc++; tests/test_numba_compatibility.py uses it to
            # guard against the macOS weak-symbol coalescing crash. Tolerate Python versions that have no
            # numba wheel yet -- the test auto-skips when numba is unavailable.
            python -m pip install numba || echo "numba unavailable for Python $version (numba compatibility test will skip)"
            pyenv shell --unset
          done
      - name: Remove /usr/local/bin/python3
        run: |
          sudo rm -f /usr/local/bin/python3
      - name: Install go for macOS
        run: |
          brew update
          brew install go lz4
          go version
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Update version for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.9

          # Install bump-my-version
          python -m pip install bump-my-version
          TAG_NAME=${GITHUB_REF#refs/tags/v}
          bump-my-version replace --new-version $TAG_NAME
          echo "Version files updated to $TAG_NAME"
          pyenv shell --unset
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64-build-artifacts
          path: ./artifacts
      - name: Restore artifacts to original paths
        run: |
          mv ./artifacts/libchdb.so ./
          # Move libchdb.a if it exists (not built in DEBUG_MODE)
          [ -f ./artifacts/libchdb.a ] && mv ./artifacts/libchdb.a ./
          mv ./artifacts/chdb/_chdb.abi3.so ./chdb/
          mv ./artifacts/chdb/libpybind11nonlimitedapi_stubs.dylib ./chdb/
          for v in 9 10 11 12 13 14; do
            mv ./artifacts/chdb/libpybind11nonlimitedapi_chdb_3.${v}.dylib ./chdb/
          done
          cp -a ./artifacts/libchdb.so.dSYM ./
          cp -a ./artifacts/_chdb.abi3.so.dSYM ./
          ls -lh ./libchdb.so
          ls -lh ./chdb/*.so ./chdb/*.dylib
      - name: Sign macOS binaries
        run: |
          echo "Signing cross-compiled binaries for macOS..."
          codesign -f -s - ./libchdb.so
          codesign -f -s - ./chdb/_chdb.abi3.so
          codesign -f -s - ./chdb/libpybind11nonlimitedapi_stubs.dylib
          for f in ./chdb/libpybind11nonlimitedapi_chdb_3.*.dylib; do
            codesign -f -s - "$f"
          done
          echo "Verifying signatures..."
          codesign -dvv ./libchdb.so
          codesign -dvv ./chdb/_chdb.abi3.so
      - name: Run chdb/test_smoke.sh
        timeout-minutes: 600
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.9
          bash gen_manifest.sh
          bash -x ./chdb/test_smoke.sh cross-compile
      - name: Run chdb/build/test_go_example.sh
        if: env.EFFECTIVE_DEBUG_MODE != 'true'
        timeout-minutes: 600
        run: |
          bash ./chdb/build/test_go_example.sh ${{ github.workspace }}/libchdb.a
        continue-on-error: false
      - name: Run libchdb stub in examples dir
        run: |
          bash -x ./examples/runStub.sh
          bash -x ./examples/runArrowTest.sh
          bash -x ./examples/runArrowStreamParse.sh
          bash -x ./examples/runArrowQueryTest.sh
          bash -x ./examples/runInsertProgressTest.sh
          bash -x ./examples/runStreamInsertTest.sh
          bash -x ./examples/runVersionHeaderTest.sh
          bash -x ./examples/runVersionTest.sh
          bash -x ./examples/runStackTraceTest.sh
          bash -x ./examples/runStreamErrorTest.sh
          bash -x ./examples/runQueryParamsTest.sh
          bash -x ./examples/runStreamQueryEofTest.sh
      # Both ADBC validation suites, against the libchdb just built. Placed
      # here rather than after the wheel tests so an unrelated failure there
      # does not withhold the result.
      - name: ADBC validation suites
        run: |
          set -eo pipefail
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"

          BUILD_DIR="$RUNNER_TEMP/adbc-validation"
          VENV="$RUNNER_TEMP/adbc-validation-venv"
          rm -rf "$BUILD_DIR" "$VENV"

          cmake -S programs/local/adbc/validation -B "$BUILD_DIR" \
            -DCMAKE_BUILD_TYPE=Release
          cmake --build "$BUILD_DIR" --parallel "$(getconf _NPROCESSORS_ONLN)"
          CHDB_ADBC_DRIVER="$GITHUB_WORKSPACE/libchdb.so" \
            programs/local/adbc/validation/run.sh "$BUILD_DIR"

          pyenv shell 3.13
          python -m venv "$VENV"
          "$VENV/bin/pip" install --disable-pip-version-check \
            -r programs/local/adbc/validation/python/requirements.txt
          cd programs/local/adbc/validation/python
          TZ=UTC CHDB_ADBC_DRIVER="$GITHUB_WORKSPACE/libchdb.so" \
            "$VENV/bin/python" -m pytest -q -rfEsxX \
              --junit-xml=validation-report.xml tests/
          # The capability matrix is rendered from the run, not maintained by hand.
          "$VENV/bin/python" -m tests.generate_documentation \
            --output "$RUNNER_TEMP/adbc-docs"
      - uses: actions/upload-artifact@v7
        with:
          name: adbc-capability-matrix
          path: ${{ runner.temp }}/adbc-docs/chdb.md
      - name: Build wheels
        run: |
          rm -rf chdb/build/
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.9
          make wheel
      - name: Fix wheel platform tag
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.9
          python -m wheel tags --platform-tag=macosx_11_0_arm64 --remove dist/*.whl
      - name: Verify wheel sizes
        run: |
          echo "=== Wheel sizes ==="
          du -sh dist/*
      - name: Setup core dump collection
        run: |
          mkdir -p tmp/core
          sudo sysctl kern.corefile=$PWD/tmp/core/core.%P
          sudo sysctl kern.coredump=1
          ulimit -c unlimited
      - name: Start MinIO for S3 streaming-insert tests
        continue-on-error: true
        run: |
          # Provide a local S3-compatible endpoint so tests/test_streaming_insert_s3.py
          # runs in CI. Best-effort: the test self-skips if the endpoint is unreachable,
          # so a download/start hiccup never fails the build.
          case "$(uname -s)-$(uname -m)" in
            Linux-x86_64)  OSARCH=linux-amd64 ;;
            Linux-aarch64) OSARCH=linux-arm64 ;;
            Darwin-arm64)  OSARCH=darwin-arm64 ;;
            Darwin-x86_64) OSARCH=darwin-amd64 ;;
            *) echo "unknown platform $(uname -s)-$(uname -m); skipping MinIO"; exit 0 ;;
          esac
          BIN="$HOME/.local/bin"; mkdir -p "$BIN"
          command -v minio >/dev/null 2>&1 || { curl -sSL "https://dl.min.io/server/minio/release/$OSARCH/minio" -o "$BIN/minio" && chmod +x "$BIN/minio"; }
          command -v mc    >/dev/null 2>&1 || { curl -sSL "https://dl.min.io/client/mc/release/$OSARCH/mc"       -o "$BIN/mc"    && chmod +x "$BIN/mc"; }
          export PATH="$BIN:$PATH"
          mkdir -p /tmp/minio_data
          MINIO_ROOT_USER=clickhouse MINIO_ROOT_PASSWORD=clickhouse \
            minio server --address ":11111" /tmp/minio_data > /tmp/minio.log 2>&1 &
          for i in $(seq 1 20); do
            if mc alias set ciminio http://localhost:11111 clickhouse clickhouse >/dev/null 2>&1; then
              mc mb --ignore-existing ciminio/test >/dev/null 2>&1 || true
              {
                echo "CHDB_S3_TEST=1"
                echo "CHDB_S3_ENDPOINT=http://localhost:11111/test"
                echo "CHDB_S3_ACCESS_KEY=clickhouse"
                echo "CHDB_S3_SECRET_KEY=clickhouse"
              } >> "$GITHUB_ENV"
              echo "MinIO ready on :11111; S3 streaming-insert tests enabled."
              break
            fi
            sleep 1
          done
      - name: Test wheel on all Python versions
        run: |
          ulimit -c unlimited
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"

          DEBUG_MODE="${{ env.EFFECTIVE_DEBUG_MODE }}"

          for version in 3.9 3.10 3.11 3.12 3.13 3.14; do
            # pandas 3.x requires Python >=3.11
            if [[ "$version" == "3.9" || "$version" == "3.10" ]]; then
              PANDAS_CONSTRAINTS=("pandas<3.0")
            else
              PANDAS_CONSTRAINTS=("pandas<3.0" "pandas>=3.0")
            fi
            for PANDAS_CONSTRAINT in "${PANDAS_CONSTRAINTS[@]}"; do
              echo "=============================================="
              echo "Testing chdb on Python $version with $PANDAS_CONSTRAINT"
              echo "=============================================="
              pyenv shell $version
              python -m pip install dist/*.whl "$PANDAS_CONSTRAINT" --force-reinstall --no-cache-dir
              # ADBC driver tests (tests/test_adbc_driver.py) load libchdb via the standard driver manager
              python -c "import adbc_driver_manager" 2>/dev/null || python -m pip install -q adbc-driver-manager==1.8.0
              echo "Installed pandas version:"
              python -c "import pandas; print(pandas.__version__)"
              python -c "import chdb; res = chdb.query('select 1112222222,555', 'CSV'); print(f'Python $version: {res}')"

              if [ "$DEBUG_MODE" == "true" ]; then
                python -m pip install pytest pytest-cov pytest-timeout
                REAL_PYTHON=$(pyenv which python)
                echo "=== Running tests with lldb on Python $version (path: $REAL_PYTHON) ==="
                LLDB_OUTPUT=$(mktemp)
                lldb -b \
                  -o "process handle SIGABRT -n true -p true -s true" \
                  -o "process handle SIGSEGV -n true -p true -s true" \
                  -o "process handle SIGBUS -n true -p true -s true" \
                  -o "process handle SIGFPE -n true -p true -s true" \
                  -o "process handle SIGILL -n true -p true -s true" \
                  -o "target stop-hook add --one-liner 'bt all'" \
                  -o "target stop-hook add --one-liner 'quit'" \
                  -o "run -m pytest tests/ -v --tb=short" \
                  -o "bt all" \
                  -o "quit" \
                  -- "$REAL_PYTHON" 2>&1 | tee "$LLDB_OUTPUT"
                if grep -qE "(stop reason = signal|received signal|hit Breakpoint.*__abort|Process.*exited.*signal)" "$LLDB_OUTPUT"; then
                  echo "ERROR: Crash signal detected!"
                  rm -f "$LLDB_OUTPUT"
                  exit 1
                fi
                EXIT_CODE=$(grep -oE "Process [0-9]+ exited with status = [0-9]+" "$LLDB_OUTPUT" | tail -1 | sed "s/.*= //" || echo "0")
                rm -f "$LLDB_OUTPUT"
                if [ "$EXIT_CODE" != "0" ]; then
                  echo "ERROR: Tests failed with exit code $EXIT_CODE"
                  exit $EXIT_CODE
                fi
              else
                make test
              fi

              python -m pip uninstall -y chdb-core
              echo "=============================================="
              echo "Tests PASSED on Python $version with $PANDAS_CONSTRAINT"
              echo "=============================================="
            done
            pyenv shell --unset
          done
        continue-on-error: false
      - name: "numba import-order regression (conda numba, arm64)"
        run: |
          # Regression guard for the macOS import-order crash. conda's libc++
          # exports std::__1 as STRONG symbols; without the stub/shim
          # std::__1-hiding fix they override chdb's WEAK std::__1 (~86
          # basic_string methods used by pybind11 EnsureSharedLibraryIsLoaded),
          # corrupting the library-name string and aborting. pip numba wheels
          # delocate libc++ and cannot reproduce this; conda numba can.
          curl -Ls -o /tmp/mc.sh https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh
          bash /tmp/mc.sh -b -p "$HOME/mc"
          source "$HOME/mc/bin/activate"
          conda create -y -n nb -c conda-forge "python=3.11" numba pip
          conda activate nb
          python -m pip install dist/chdb_core-*.whl --force-reinstall --no-cache-dir
          echo "=== control: import chdb then numba ==="
          python -c "import chdb; import numba; print(chdb.query('SELECT 2', 'CSV'))"
          echo "=== regressing: import numba then chdb (must NOT abort with the fix) ==="
          python -c "import numba; import chdb; print(chdb.query('SELECT 1', 'CSV'))"
          conda deactivate
        continue-on-error: false
      - name: Test torch compatibility on Python 3.11
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.11
          python -m pip install dist/*.whl --force-reinstall --no-cache-dir
          python -m pip install pytest
          python -m pip install torch --index-url https://download.pytorch.org/whl/cpu
          python -m pytest tests/test_torch_compatibility.py -v
          pyenv shell --unset
        continue-on-error: false
      - name: Test chdb DataStore tests against upstream chdb (latest tag)
        if: env.EFFECTIVE_DEBUG_MODE != 'true'
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.11
          python -m pip install dist/*.whl --force-reinstall --no-cache-dir
          PYTHON=$(pyenv which python) bash ./chdb/test_chdb_datastore.sh
          pyenv shell --unset
        continue-on-error: false
      - name: Run notebook tests
        if: env.EFFECTIVE_DEBUG_MODE != 'true'
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.9
          python -m pip install dist/*.whl --force-reinstall
          jupyter nbconvert --to notebook --execute tests/test_data_insertion.ipynb --output test_data_insertion_output.ipynb
          pyenv shell --unset
        continue-on-error: false
      # Verify+package debug must run before the lite swap (overwrites _chdb.abi3.so).
      - name: Verify debug symbols are usable
        run: |
          verify() {
            local so=$1 symbol=$2 dsym=$3
            [ -f "$so" ] || { echo "FAIL: missing $so"; exit 1; }
            [ -d "$dsym" ] || { echo "FAIL: missing $dsym"; exit 1; }
            local bin_uuid=$(dwarfdump --uuid "$so" | awk '{print $2}')
            local dsym_uuid=$(dwarfdump --uuid "$dsym" | awk '{print $2}')
            [ -n "$bin_uuid" ] && [ -n "$dsym_uuid" ] || { echo "FAIL: empty UUID (bin='$bin_uuid' dsym='$dsym_uuid')"; exit 1; }
            [ "$bin_uuid" = "$dsym_uuid" ] || { echo "FAIL: UUID mismatch $bin_uuid vs $dsym_uuid"; exit 1; }
            echo "$so UUID matches $dsym: $bin_uuid"
            local addr=$(nm -gU "$so" | awk -v s="_$symbol" '$3 == s {print "0x" $1; exit}')
            [ -n "$addr" ] || { echo "FAIL: $symbol not exported in $so"; exit 1; }
            local dwarf="$dsym/Contents/Resources/DWARF/$(basename "$so")"
            local resolved=$(atos -o "$dwarf" "$addr")
            echo "atos $dwarf $addr ($symbol) -> $resolved"
            echo "$resolved" | grep -qE ' \([^()]*:[0-9]+\)$' || { echo "FAIL: atos did not resolve to (file:line) for $addr"; exit 1; }
          }
          verify chdb/_chdb.abi3.so PyInit__chdb _chdb.abi3.so.dSYM
          verify libchdb.so query_stable libchdb.so.dSYM
      - name: Package debug symbols
        run: |
          ls *.dSYM
          tar -czvf macos-arm64-debuginfo.tar.gz *.dSYM
          ls -lh macos-arm64-debuginfo.tar.gz
      # -----------------------------------------------------------------------
      # chdb-core-lite: download the lite .abi3.so artifact, swap it in, build
      # & test the slim variant wheel. setup.py rewrites pyproject.toml's name
      # to "chdb-core-lite" when CHDB_LITE=1 (Restore step at the end undoes it).
      # -----------------------------------------------------------------------
      - name: Download chdb-core-lite build artifact
        uses: actions/download-artifact@v8
        with:
          name: macos-arm64-build-artifacts-lite
          path: ./artifacts-lite
      - name: Swap in chdb-core-lite .abi3.so and sign
        run: |
          mv ./artifacts-lite/_chdb-lite.abi3.so ./chdb/_chdb.abi3.so
          codesign -f -s - ./chdb/_chdb.abi3.so
          ls -lh ./chdb/_chdb.abi3.so
      - name: Build chdb-core-lite wheel
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.9
          rm -rf build chdb.egg-info
          CHDB_LITE=1 make wheel
          python -m wheel tags --platform-tag=macosx_11_0_arm64 --remove dist/chdb_core_lite-*.whl
          ls -lh dist/
      - name: Verify chdb-core-lite wheel size < 50 MiB
        run: |
          set -e
          WHEEL=$(ls dist/chdb_core_lite-*macosx*.whl | head -1)
          SIZE=$(wc -c < "$WHEEL" | tr -d ' ')
          MAX=52428800
          MIB=$(awk "BEGIN{printf \"%.2f\", $SIZE/1048576}")
          if [ "$SIZE" -ge "$MAX" ]; then
            echo "ERROR: $(basename $WHEEL) is $SIZE bytes (${MIB} MiB), must be < 50 MiB (52,428,800 bytes)"
            exit 1
          fi
          echo "OK: $(basename $WHEEL) is $SIZE bytes (${MIB} MiB), under 50 MiB"
      - name: Test chdb-core-lite wheel on Python 3.9 and 3.14
        run: |
          ulimit -c unlimited
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          for version in 3.9 3.14; do
            echo "=============================================="
            echo "Testing chdb-core-lite on Python $version"
            echo "=============================================="
            pyenv shell $version
            python -m pip uninstall -y chdb-core || true
            python -m pip uninstall -y chdb-core-lite || true
            python -m pip install dist/chdb_core_lite-*.whl --force-reinstall --no-cache-dir
            python -c "import chdb; res = chdb.query('select 1112222222,555', 'CSV'); print(f'Python $version: {res}')"
            # Full test suite + lite-only tests (CHDB_LITE=1 unlocks tests/test_chdb_core_lite.py)
            CHDB_LITE=1 make test
            python -m pip uninstall -y chdb-core-lite
            echo "=============================================="
            echo "Tests PASSED on Python $version"
            echo "=============================================="
          done
          pyenv shell --unset
        continue-on-error: false
      - name: Test chdb-core-lite DataStore tests against upstream chdb (latest tag)
        if: env.EFFECTIVE_DEBUG_MODE != 'true'
        timeout-minutes: 60
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.11
          python -m pip uninstall -y chdb-core || true
          python -m pip uninstall -y chdb-core-lite || true
          python -m pip install dist/chdb_core_lite-*macosx*.whl --force-reinstall
          CHDB_LITE=1 PYTHON=$(pyenv which python) bash ./chdb/test_chdb_datastore.sh
          python -m pip uninstall -y chdb-core-lite
          pyenv shell --unset
        continue-on-error: false
      - name: Restore pyproject.toml (chdb-core-lite build mutates it in place)
        if: always()
        run: git checkout -- pyproject.toml
      - name: Check and upload core files if present
        if: always()
        run: |
          if ls tmp/core/core.* >/dev/null 2>&1; then
            echo "CORE_FILES_FOUND=true" >> $GITHUB_ENV
            tar -czvf core-files-macos-arm64.tar.gz tmp/core/core.*
            echo "Core files tar created: core-files-macos-arm64.tar.gz"
            ls -lh core-files-macos-arm64.tar.gz
          else
            echo "CORE_FILES_FOUND=false" >> $GITHUB_ENV
            echo "No core files found in tmp/core"
          fi
        continue-on-error: true
      - name: Upload core files artifact
        if: always() && env.CORE_FILES_FOUND == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: core-files-macos-arm64
          path: core-files-macos-arm64.tar.gz
      - name: Show files
        run: ls -lh dist
        shell: bash
      - name: Upload wheels to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload ${{ github.ref_name }} dist/chdb_core-*.whl --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Upload chdb-core-lite wheel to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload ${{ github.ref_name }} dist/chdb_core_lite-*.whl --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Packege libchdb.so
        run: |
          cp programs/local/chdb.h chdb.h
          cp programs/local/chdb.hpp chdb.hpp
          tar -czvf macos-arm64-libchdb.tar.gz libchdb.so chdb.h chdb.hpp
      - name: Package libchdb.a
        if: env.EFFECTIVE_DEBUG_MODE != 'true'
        run: |
          cp programs/local/chdb.h chdb.h
          cp programs/local/chdb.hpp chdb.hpp
          tar -czvf macos-arm64-libchdb-static.tar.gz libchdb.a chdb.h chdb.hpp
      - name: Upload libchdb.so to release
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          gh release upload ${{ github.ref_name }} macos-arm64-libchdb.tar.gz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Upload libchdb.a to release
        if: startsWith(github.ref, 'refs/tags/v') && env.EFFECTIVE_DEBUG_MODE != 'true'
        run: |
          gh release upload ${{ github.ref_name }} macos-arm64-libchdb-static.tar.gz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - name: Upload debug symbols to release
        if: startsWith(github.ref, 'refs/tags/v')
        continue-on-error: true
        run: |
          gh release upload ${{ github.ref_name }} macos-arm64-debuginfo.tar.gz --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
      - uses: actions/upload-artifact@v7
        with:
          name: chdb-artifacts-macos-arm64
          path: |
            ./dist/*.whl
            ./macos-arm64-libchdb.tar.gz
            ./macos-arm64-libchdb-static.tar.gz
            ./macos-arm64-debuginfo.tar.gz
          overwrite: true
      - name: Upload pypi
        if: startsWith(github.ref, 'refs/tags/v') && !contains(github.ref_name, 'rc')
        run: |
          export PATH="$HOME/.pyenv/bin:$PATH"
          eval "$(pyenv init -)"
          pyenv shell 3.9
          python -m twine upload dist/chdb_core-*.whl
        env:
          TWINE_USERNAME: __token__
          TWINE_PASSWORD: ${{ secrets.PYPI_PASSWORD }}
      # NOTE: chdb-core-lite PyPI publishing temporarily disabled; uncomment to re-enable.
