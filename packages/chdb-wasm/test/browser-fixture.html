<!doctype html><meta charset=utf-8><title>chdb-wasm browser fixture</title><pre id=o>running…</pre>
<!-- Test fixture driven by test/browser-run.mjs. selectBundle auto-picks the bundle
     (mt when cross-origin isolated, else st); we run core queries and publish the
     results (and the chosen variant) on window.__RESULT__ for the driver to assert. -->
<script type="module">
import { AsyncChdb, selectBundle } from '../dist/index.js';
const el = document.getElementById('o');
const log = (m) => { el.textContent += '\n' + m; console.log(m); };
(async () => {
  try {
    const b = selectBundle({ baseUrl: new URL('../dist', import.meta.url).href });
    log('coi=' + self.crossOriginIsolated + ' SAB=' + (typeof SharedArrayBuffer !== 'undefined') + ' -> variant=' + b.variant);
    const db = await AsyncChdb.create({ moduleUrl: b.moduleUrl, wasmUrl: b.wasmUrl });
    const Q = async (sql) => (await db.query(sql)).text().trim();
    const out = { ok: true, variant: b.variant, coi: self.crossOriginIsolated };
    out.select1 = await Q('SELECT 1');
    out.join = await Q('SELECT count() FROM numbers(1000) a JOIN numbers(1000) b ON a.number = b.number');
    await db.query('CREATE TABLE t (x Int32) ENGINE = Memory');
    await db.query('INSERT INTO t SELECT number FROM numbers(100)');
    out.insert = await Q('SELECT count(), sum(x) FROM t');
    out.heavy = await Q('SELECT count() FROM numbers(50000000)');
    // local file IO: put a file into the wasm FS, read it back with file()
    await db.putFile('/b/data.csv', new TextEncoder().encode('id,v\n1,10\n2,20\n3,30\n'));
    out.file = await Q("SELECT count(), sum(v) FROM file('/b/data.csv','CSVWithNames')");
    // lazy local-file read: registerFile a Blob (no heap copy; Blob.slice + FileReaderSync)
    // and scan it via file('<name>') — bare name, exactly like a native path (duckdb-style).
    // Wrapped to observe per-bundle (read proxied to the runtime thread holding the Blob).
    out.regfile = await (async () => {
      try {
        await db.registerFile('reg.csv', new Blob([new TextEncoder().encode('a,b\n1,5\n2,15\n3,25\n')]));
        return (await db.query("SELECT count(), sum(b) FROM file('reg.csv','CSVWithNames')")).text().trim();
      } catch (e) { return 'ERR: ' + (e && e.message || e); }
    })();
    // Parquet read via the lazy JS reader: produce a Parquet blob (query FORMAT Parquet),
    // register it, then scan it back by NAME with auto format inference (.parquet -> Parquet).
    // Exercises ParquetV3 over ReadBufferFromJSFile (footer + row-group seeks) on both bundles.
    out.parquet = await (async () => {
      try {
        const pq = await db.query('SELECT number AS n FROM numbers(10)', 'Parquet');
        await db.registerFile('gen.parquet', new Blob([pq.data]));
        return (await db.query("SELECT count(), sum(n) FROM file('gen.parquet')")).text().trim();
      } catch (e) { return 'ERR: ' + (e && e.message || e); }
    })();
    // registerFile with a Uint8Array (zero-copy transfer + Uint8Array->Blob wrap path).
    out.regfile_u8 = await (async () => {
      try {
        await db.registerFile('reg_u8.csv', new TextEncoder().encode('a,b\n1,5\n2,15\n3,25\n'));
        return (await db.query("SELECT count(), sum(b) FROM file('reg_u8.csv','CSVWithNames')")).text().trim();
      } catch (e) { return 'ERR: ' + (e && e.message || e); }
    })();
    // Auto format inference for a registered text file (no explicit format; .csv -> CSV).
    out.regfile_infer = await (async () => {
      try {
        await db.registerFile('infer.csv', new Blob([new TextEncoder().encode('1,5\n2,15\n3,25\n')]));
        return (await db.query("SELECT count(), sum(c2) FROM file('infer.csv')")).text().trim();
      } catch (e) { return 'ERR: ' + (e && e.message || e); }
    })();
    // Parquet with an EXPLICIT format argument (skips inference; different code path).
    out.parquet_explicit = await (async () => {
      try {
        const pq = await db.query('SELECT number AS n FROM numbers(10)', 'Parquet');
        await db.registerFile('gen2.parquet', new Blob([pq.data]));
        return (await db.query("SELECT count(), sum(n) FROM file('gen2.parquet','Parquet')")).text().trim();
      } catch (e) { return 'ERR: ' + (e && e.message || e); }
    })();
    // Multi-row-group Parquet: forces footer + cross-row-group seeks (SEEK_SET to many
    // offsets) through ReadBufferFromJSFile. Assert an aggregate over all groups AND a
    // point lookup so an off-by-one in seek()/getPosition() yields wrong values, not just
    // a wrong count.
    out.parquet_seek = await (async () => {
      try {
        const pq = await db.query(
          'SELECT number AS n, toString(number) AS s FROM numbers(20000) SETTINGS output_format_parquet_row_group_size = 4096',
          'Parquet');
        await db.registerFile('big.parquet', new Blob([pq.data]));
        const agg = (await db.query("SELECT count(), sum(n) FROM file('big.parquet')")).text().trim();
        const point = (await db.query("SELECT n FROM file('big.parquet') WHERE n = 12345")).text().trim();
        return agg + '|' + point;
      } catch (e) { return 'ERR: ' + (e && e.message || e); }
    })();
    // Multiple registered files live at once (JOIN/UNION across two) + re-registering a
    // name overwrites it (Map.set semantics; the query must see the NEW bytes).
    out.regfile_multi = await (async () => {
      try {
        await db.registerFile('r1.csv', new Blob([new TextEncoder().encode('a,b\n1,10\n2,20\n')]));
        await db.registerFile('r2.csv', new Blob([new TextEncoder().encode('a,b\n3,30\n4,40\n')]));
        const u = (await db.query("SELECT count(), sum(b) FROM (SELECT * FROM file('r1.csv','CSVWithNames') UNION ALL SELECT * FROM file('r2.csv','CSVWithNames'))")).text().trim();
        await db.registerFile('r1.csv', new Blob([new TextEncoder().encode('a,b\n5,100\n')]));
        const re = (await db.query("SELECT count(), sum(b) FROM file('r1.csv','CSVWithNames')")).text().trim();
        return u + '|' + re;
      } catch (e) { return 'ERR: ' + (e && e.message || e); }
    })();
    // Error path: querying an unregistered name must reject cleanly (not crash the worker).
    out.regfile_missing = await (async () => {
      try {
        await db.query("SELECT count() FROM file('never_registered_xyz.csv','CSVWithNames')");
        return 'NO_ERROR';
      } catch (e) { return 'ERR'; }
    })();
    // unregisterFile / clearFiles: a dropped name must become unqueryable; unregister is
    // idempotent (no throw on a missing name); clearFiles drops everything. Runs last among
    // the registerFile cases so clearing doesn't disturb earlier assertions.
    out.unregister = await (async () => {
      try {
        await db.registerFile('drop.csv', new Blob([new TextEncoder().encode('a,b\n1,7\n2,8\n')]));
        const before = (await db.query("SELECT count(), sum(b) FROM file('drop.csv','CSVWithNames')")).text().trim();
        await db.unregisterFile('drop.csv');
        let after; try { await db.query("SELECT count() FROM file('drop.csv','CSVWithNames')"); after = 'STILL_THERE'; } catch { after = 'gone'; }
        await db.unregisterFile('drop.csv');   // idempotent: dropping a missing name is a no-op
        await db.registerFile('c1.csv', new Blob([new TextEncoder().encode('a,b\n3,9\n')]));
        await db.clearFiles();
        let cleared; try { await db.query("SELECT count() FROM file('c1.csv','CSVWithNames')"); cleared = 'STILL_THERE'; } catch { cleared = 'gone'; }
        return before + '|' + after + '|' + cleared;
      } catch (e) { return 'ERR: ' + (e && e.message || e); }
    })();
    // HTTP access via the host JS fetch (synchronous XHR + Range). url()/s3() reads
    // never open a socket; they go through ReadBufferFromWebFetch. Each is wrapped so a
    // transient network/CORS failure surfaces as a clear value rather than aborting the run.
    const tryQ = async (sql) => { try { return await Q(sql); } catch (e) { return 'ERR: ' + (e && e.message || e); } };
    // same-origin http read (hermetic: served by browser-run.mjs's local server, which
    // ignores Range and returns 200 -> exercises the full-body slice path)
    out.url_local = await tryQ("SELECT count(), sum(v) FROM url('" + location.origin + "/test/url_data.csv','CSVWithNames')");
    // public cross-origin reads (CORS + Range enabled bucket): url() and s3() (anonymous)
    const PUB = 'https://datasets-documentation.s3.eu-west-3.amazonaws.com/nyc-taxi/taxi_zone_lookup.csv';
    out.url_public = await tryQ("SELECT count() FROM url('" + PUB + "','CSVWithNames')");
    out.s3_public = await tryQ("SELECT count() FROM s3('" + PUB + "','CSVWithNames')");
    // url() error path: a 404 (the local server returns 404 for unknown paths) must
    // surface as a NETWORK_ERROR (chdb_web_read returns -1 on non-200/206), not succeed.
    out.url_404 = await tryQ("SELECT count() FROM url('" + location.origin + "/test/does_not_exist_xyz.csv','CSVWithNames')");
    await db.terminate();
    log('done: ' + JSON.stringify(out));
    window.__RESULT__ = out;
  } catch (e) {
    log('FATAL ' + (e && e.message || e));
    window.__RESULT__ = { fatal: String(e && e.message || e).slice(0, 200) };
  }
})();
setTimeout(() => { if (window.__RESULT__ === undefined) window.__RESULT__ = { timeout: true }; }, 110000);
</script>
